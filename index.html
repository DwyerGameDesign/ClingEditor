  if (ny > 0){ nx = -nx; ny = -ny; }
  ctx.strokeStyle = INK; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.lineWidth = 1;
  for (let t=0.2; t<=0.8; t+=0.2){
    const mx = x1+(x2-x1)*t, my = y1+(y2-y1)*t;
    ctx.beginPath(); ctx.moveTo(mx,my); ctx.lineTo(mx+nx*5, my+ny*5); ctx.stroke();
  }
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.arc(x1,y1,2,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(x2,y2,2,0,7); ctx.fill();
}
function drawBouncerAtS(cx,cy,r){
  ctx.strokeStyle = INK; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.stroke();
  ctx.lineWidth = 1;
  for (let i=0;i<4;i++){
    const a = i*Math.PI/2 + frame*0.08;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*r*0.3, cy+Math.sin(a)*r*0.3);
    ctx.lineTo(cx+Math.cos(a)*r*0.85, cy+Math.sin(a)*r*0.85);
    ctx.stroke();
  }
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.arc(cx,cy,2.5,0,7); ctx.fill();
}
function drawBreakableWallAtS(cx,cy,len,angleDeg,broken){
  if (broken){
    ctx.strokeStyle = dither(0.25); ctx.lineWidth = 1; ctx.setLineDash([3,3]);
    const [x1,y1,x2,y2] = barEndpointsScreen(cx,cy,len,angleDeg);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.setLineDash([]);
    return;
  }
  drawWallBody(cx,cy,len,angleDeg);
  // Crack cue: short tick across midspan
  const a = rad(angleDeg);
  const nx = -Math.sin(a), ny = Math.cos(a);
  ctx.strokeStyle = INK; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx-nx*5, cy-ny*5); ctx.lineTo(cx+nx*5, cy+ny*5);
  ctx.stroke();
}
function drawObject(o,i){
  const selected = (i === selIdx);
  switch(o.type){
    case "spawn": drawSpawn(o); break;
    case "exit": drawExit(o); break;
    case "coin": drawCoin(o); break;
    case "hazard": { const [cx,cy]=toScreen(o.x,o.y); drawHazardBody(cx,cy,o.radius,frame); break; }
    case "wall": case "toggle_wall": {
      const [cx,cy]=toScreen(o.x,o.y);
      drawWallBody(cx,cy,o.length,effAngle(o,i));
      break;
    }
    case "breakable_wall": {
      const [cx,cy]=toScreen(o.x,o.y);
      drawBreakableWallAtS(cx,cy,o.length,effAngle(o,i), false);
      break;
    }
    case "bounce_pad": {
      const [cx,cy]=toScreen(o.x,o.y);
      drawBouncePadAtS(cx,cy,o.length,effAngle(o,i));
      break;
    }
    case "bouncer": {
      const [cx,cy]=toScreen(o.x,o.y);
      drawBouncerAtS(cx,cy,o.radius??CFG.BOUNCER_RADIUS);
      break;
    }
    case "sweeper": drawSweeper(o,i); break;
    case "deflector": drawDeflector(o,i,selected); break;
    case "sliding_wall": {
      drawSlideRailFor(o);
      const [cx,cy]=slideBodyScreen(o,effPos(o,i));
      drawWallBody(cx,cy,o.length,effAngle(o,i), selected?7:undefined, CFG.BAR_WIDTH);
      break;
    }
    case "moving_wall": {
      drawSlideRailFor(o);
      const [cx,cy]=slideBodyScreen(o,effPos(o,i));
      drawWallBody(cx,cy,o.length,effAngle(o,i));
      break;
    }
    case "moving_hazard": {
      drawSlideRailFor(o);
      const [cx,cy]=slideBodyScreen(o,effPos(o,i));
      drawHazardBody(cx,cy,o.radius,frame);
      break;
    }
    case "launcher": drawLauncher(o,i,selected); break;
  }
}

/* ---------- editor overlays ---------- */
function objectReach(o){
  if (o.type==="hazard"||o.type==="moving_hazard"||o.type==="bouncer") return (o.radius||14)+5;
  if (o.type==="deflector"||o.type==="bounce_pad") return o.length/2 + 8;
  if (BAR_TYPES.has(o.type)) return o.length/2;
  return 10;
}
function drawOverlays(){
  const showKill = el("ovKill").checked;
  const showReach = el("ovReach").checked;
  const showSnap = el("ovSnap").checked;
  ctx.save();
  ctx.lineWidth = 1;

  if (showKill){
    for (let i=0;i<level.objects.length;i++){
      const o = level.objects[i];
      if (o.type === "hazard"){
        const [cx,cy]=toScreen(o.x,o.y);
        killCircles(cx,cy,o.radius);
      } else if (o.type === "moving_hazard"){
        for (const pos of [0,1]){
          const [cx,cy]=slideBodyScreen(o,pos);
          killCircles(cx,cy,o.radius);
        }
      }
    }
  }
  if (showReach){
    for (const o of level.objects){
      if (o.type !== "deflector") continue;
      const [cx,cy]=toScreen(o.x,o.y);
      ctx.strokeStyle = "rgba(30,80,200,.55)";
      ctx.setLineDash([4,3]);
      ctx.beginPath(); ctx.arc(cx,cy,o.length/2+8,0,7); ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  if (showSnap){
    ctx.strokeStyle = "rgba(30,140,50,.6)";
    for (let i=0;i<level.objects.length;i++){
      const o = level.objects[i];
      const pts = [];
      if (BAR_TYPES.has(o.type)){
        const [cx,cy] = bodyCenterScreen(o,i);
        const [x1,y1,x2,y2] = barEndpointsScreen(cx,cy,o.length,effAngle(o,i));
        pts.push([x1,y1],[x2,y2]);
      }
      if (SLIDE_TYPES.has(o.type)){
        const [sx,sy]=toScreen(o.x,o.y);
        const sp=slideSpan(o), r=rad(o.slideAngle||0);
        pts.push([sx-Math.cos(r)*sp, sy-Math.sin(r)*sp],[sx+Math.cos(r)*sp, sy+Math.sin(r)*sp]);
      }
      for (const [px,py] of pts){
        ctx.beginPath(); ctx.arc(px,py,CFG.JUNCTION_SNAP,0,7); ctx.stroke();
      }
    }
  }
  ctx.restore();
}
function killCircles(cx,cy,r){
  ctx.strokeStyle = "rgba(200,30,30,.75)";
  ctx.beginPath(); ctx.arc(cx,cy,r+5,0,7); ctx.stroke();
  ctx.strokeStyle = "rgba(200,30,30,.22)";
  ctx.beginPath(); ctx.arc(cx,cy,r+30,0,7); ctx.stroke();
}
function drawGrid(){
  if (!el("ovGrid").checked) return;
  ctx.save();
  ctx.strokeStyle = "rgba(0,0,0,.07)";
  ctx.lineWidth = 0.5;
  for (let x=0;x<=400;x+=20){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,240); ctx.stroke(); }
  for (let y=0;y<=240;y+=20){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(400,y); ctx.stroke(); }
  ctx.strokeStyle = "rgba(0,0,0,.18)";
  ctx.beginPath(); ctx.moveTo(200,0); ctx.lineTo(200,240); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,120); ctx.lineTo(400,120); ctx.stroke();
  ctx.restore();
}
function drawSelection(){
  if (selIdx < 0 || selIdx >= level.objects.length) return;
  const o = level.objects[selIdx];
  const [cx,cy] = bodyCenterScreen(o,selIdx);
  ctx.save();
  // marching ants bounds
  let hw=12, hh=12;
  if (BAR_TYPES.has(o.type)){ hw = o.length/2+6; hh = hw; }
  if (o.type==="hazard"||o.type==="moving_hazard"||o.type==="bouncer"){ hw=hh=(o.radius||CFG.BOUNCER_RADIUS)+6; }
  ctx.strokeStyle = "rgba(216,129,0,.95)";
  ctx.lineWidth = 1;
  ctx.setLineDash([4,3]);
  ctx.lineDashOffset = -(frame%14)/2;
  ctx.beginPath(); ctx.arc(cx,cy,Math.max(hw,hh),0,7); ctx.stroke();
  ctx.setLineDash([]);
  // rotation handle
  const h = rotHandlePos(o,selIdx);
  if (h){
    ctx.strokeStyle = "rgba(216,129,0,.9)";
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(h[0],h[1]); ctx.stroke();
    ctx.fillStyle = "#d88100";
    ctx.beginPath(); ctx.arc(h[0],h[1],4.5,0,7); ctx.fill();
    ctx.strokeStyle = "#111";
    ctx.beginPath(); ctx.arc(h[0],h[1],4.5,0,7); ctx.stroke();
  }
  // slide-angle handle (square at rail + end)
  const sh = slideHandlePos(o);
  if (sh){
    ctx.fillStyle = "#d88100";
    ctx.fillRect(sh[0]-3.5, sh[1]-3.5, 7, 7);
    ctx.strokeStyle = "#111";
    ctx.strokeRect(sh[0]-3.5, sh[1]-3.5, 7, 7);
  }
  ctx.restore();
}
function rotHandlePos(o,i){
  if (!ANGLED.has(o.type)) return null;
  const [cx,cy] = bodyCenterScreen(o,i);
  const a = rad(effAngle(o,i));
  const d = (o.type==="launcher") ? 32 : o.length/2 + 14;
  return [cx+Math.cos(a)*d, cy+Math.sin(a)*d];
}
function slideHandlePos(o){
  if (!SLIDE_TYPES.has(o.type)) return null;
  const [sx,sy] = toScreen(o.x,o.y);
  const sp = slideSpan(o)+11, r = rad(o.slideAngle||0);
  return [sx+Math.cos(r)*sp, sy+Math.sin(r)*sp];
}

/* ---------- render loop ---------- */
function render(){
  ctx.setTransform(2,0,0,2,0,0);
  ctx.fillStyle = "#fff";
  ctx.fillRect(0,0,400,240);
  drawGrid();
  drawArena(level.ceiling, level.spikedEdges);
  for (let i=0;i<level.objects.length;i++) drawObject(level.objects[i], i);
  drawOverlays();
  if (!playing) drawSelection();
}
let acc = 0, lastT = 0;
function loop(t){
  if (!lastT) lastT = t;
  acc += (t-lastT)/1000; lastT = t;
  if (acc > 0.5) acc = 0.5;
  const stepDt = 1/CFG.FPS;
  while (acc >= stepDt){
    acc -= stepDt;
    frame++;
    if (testing && testSim){
      testSim.handleCrank(consumeCrank());
      testSim.update();
    } else if (playing) stepMovers();
  }
  if (testing && testSim) drawSim(testSim);
  else render();
  requestAnimationFrame(loop);
}

/* ---------- play mode (step() ports) ---------- */
function startPlay(){
  runtime = level.objects.map(o=>{
    if (o.type==="sweeper")
      return {angle:o.angle||0, dir:1, speed:CFG.SWEEPER_SPEEDS[o.speed]||CFG.SWEEPER_SPEEDS.M};
    if (o.type==="toggle_wall")
      return {angle:(((o.angle||0)%360)+360)%360, base:o.angle||0, k:0, timer:0,
              interval:CFG.TOGGLE_INTERVALS[o.speed]||CFG.TOGGLE_INTERVALS.M, step:o.angleStep??45};
    if (o.type==="moving_wall"||o.type==="moving_hazard")
      return {pos:o.objectPosition, dir:(o.objectPosition >= 1-0.001)?-1:1,
              speed:CFG.MOVING_SPEEDS[o.speed]||CFG.MOVING_SPEEDS.M};
    return {};
  });
  playing = true;
  el("btnPlay").innerHTML = "&#9632; Stop";
  el("btnPlay").classList.add("active");
  el("stMode").textContent = "MOVERS — autonomous objects animating (editing paused)";
}
function stopPlay(){
  if (testing) stopTest();
  if (!playing) return;
  playing = false; runtime = null;
  el("btnPlay").innerHTML = "&#9654; Movers";
  el("btnPlay").classList.remove("active");
  el("stMode").textContent = "";
}
function stepMovers(){
  for (let i=0;i<level.objects.length;i++){
    const o = level.objects[i], rt = runtime[i];
    if (o.type==="sweeper"){
      rt.angle += rt.dir*rt.speed;
      const mn = o.minAngle??0, mx = o.maxAngle??90;
      if (rt.angle >= mx){ rt.angle = mx; rt.dir = -1; }
      else if (rt.angle <= mn){ rt.angle = mn; rt.dir = 1; }
    } else if (o.type==="toggle_wall"){
      rt.timer++;
      if (rt.timer >= rt.interval){
        rt.timer = 0; rt.k++;
        rt.angle = (((rt.base + rt.k*rt.step)%360)+360)%360;
      }
    } else if (o.type==="moving_wall"||o.type==="moving_hazard"){
      rt.pos += rt.dir*rt.speed;
      if (rt.pos >= 1){ rt.pos = 1; rt.dir = -1; }
      else if (rt.pos <= 0){ rt.pos = 0; rt.dir = 1; }
    }
  }
}

/* ---------- TEST MODE (gameplay simulation) ---------- */
let testing = false, testSim = null;
let wheelAccum = 0;
const testKeys = new Set();
const KEY_CRANK_DEG = 9, KEY_CRANK_FINE = 3;

function startTest(){
  const crank = level.objects.filter(o=>CRANKABLE.has(o.type)).length;
  if (crank > 3){
    alert("Can't test: "+crank+" crankables (deflector + sliding wall + launcher). The game asserts a max of 3.");
    return;
  }
  stopPlay();           // also stops any previous test
  setArmed(null);
  selIdx = -1; refreshSel();
  testSim = createClingSim(deepCopy(level));
  testing = true;
  wheelAccum = 0; testKeys.clear();
  el("btnTest").innerHTML = "&#9632; Stop test";
  el("btnTest").classList.add("active");
  el("stMode").innerHTML = "TEST — <b>wheel / &#8592;&#8594;</b> crank &nbsp;<b>&#8593;</b> CLING/FIRE &nbsp;<b>&#8595;</b> drop &nbsp;<b>Tab</b> cycle &nbsp;<b>R</b> restart &nbsp;<b>Esc</b> exit";
  cv.style.cursor = "default";
  cv.focus && cv.focus();
}
function stopTest(){
  if (!testing) return;
  testing = false; testSim = null;
  testKeys.clear(); wheelAccum = 0;
  el("btnTest").innerHTML = "&#127918; Test";
  el("btnTest").classList.remove("active");
  el("stMode").textContent = "";
  cv.style.cursor = "crosshair";
}
function consumeCrank(){
  let c = 0;
  const fine = testKeys.has("Shift");
  const rate = fine ? KEY_CRANK_FINE : KEY_CRANK_DEG;
  if (testKeys.has("ArrowRight") || testKeys.has("d")) c += rate;
  if (testKeys.has("ArrowLeft") || testKeys.has("a")) c -= rate;
  if (wheelAccum !== 0){
    const take = Math.max(-40, Math.min(40, wheelAccum));
    wheelAccum -= take;
    if (Math.abs(wheelAccum) < 0.01) wheelAccum = 0;
    c += take;
  }
  return c;
}
cv.addEventListener("wheel", e=>{
  if (!testing) return;
  e.preventDefault();
  wheelAccum += e.deltaY * 0.35;
  if (wheelAccum > 240) wheelAccum = 240;
  if (wheelAccum < -240) wheelAccum = -240;
}, {passive:false});

window.addEventListener("keyup", e=>{
  testKeys.delete(e.key);
  testKeys.delete(e.key.toLowerCase());
});
window.addEventListener("blur", ()=>testKeys.clear());

/* ---------- test-mode drawing (ports of game.drawGame + clingball.draw) --- */
function drawSelectionHighlightS(cx,cy,frameCount){
  for (const offset of [0,15]){
    const progress = (frameCount + offset) % 30;
    const t = progress/30;
    const radius = 5 + t*15;
    const lw = Math.max(1, Math.floor(3 - t*2 + 0.5));
    const alpha = 0.3 + t*0.55;
    ctx.strokeStyle = dither(alpha);
    ctx.lineWidth = lw;
    ctx.beginPath(); ctx.arc(cx,cy,Math.floor(radius+0.5),0,7); ctx.stroke();
  }
  ctx.lineWidth = 1;
}
function drawSim(sim){
  ctx.setTransform(2,0,0,2,0,0);
  ctx.fillStyle = "#fff";
  ctx.fillRect(0,0,400,240);
  const g = sim.game, ball = sim.ball;
  drawArena(g.arenaCeiling, spikedEdgesList(g.arenaSpikes || {}));

  const sel = g.crankTargets[g.selIndex];
  const docked = sim.isDocked() ? ball.dockedLauncher : null;
  for (const obj of sim.objects){
    let isSelected = !!(sel && sel.kind === "object" && sel.obj === obj);
    if (docked === obj) isSelected = true;
    switch(obj.type){
      case "spawn": drawSpawnAtS(obj.x, obj.y); break;
      case "exit": drawExitAtS(obj.x, obj.y); break;
      case "coin": if (!obj.collected) drawCoinAtS(obj.x, obj.y); break;
      case "hazard": drawHazardBody(obj.x, obj.y, obj.radius, frame); break;
      case "wall": case "toggle_wall":
        drawWallBody(obj.x, obj.y, obj.length, obj.angle); break;
      case "breakable_wall":
        drawBreakableWallAtS(obj.x, obj.y, obj.length, obj.angle, !!obj.broken); break;
      case "bounce_pad":
        drawBouncePadAtS(obj.x, obj.y, obj.length, obj.angle); break;
      case "bouncer":
        drawBouncerAtS(obj.x, obj.y, obj.radius ?? CFG.BOUNCER_RADIUS); break;
      case "sweeper": drawSweeperAtS(obj.x, obj.y, obj.length, obj.angle); break;
      case "deflector": drawDeflectorAtS(obj.x, obj.y, obj.length, obj.angle, isSelected); break;
      case "sliding_wall": {
        drawSlideRailAtS(obj.x, obj.y, obj.slideAngle, obj.minSlide, obj.maxSlide);
        const [cx,cy] = slideCenterOfSim(obj);
        drawWallBody(cx, cy, obj.length, obj.angle, isSelected ? 7 : undefined, CFG.BAR_WIDTH);
        break;
      }
      case "moving_wall": {
        drawSlideRailAtS(obj.x, obj.y, obj.slideAngle, obj.minSlide, obj.maxSlide);
        const [cx,cy] = slideCenterOfSim(obj);
        drawWallBody(cx, cy, obj.length, obj.angle);
        break;
      }
      case "moving_hazard": {
        drawSlideRailAtS(obj.x, obj.y, obj.slideAngle, obj.minSlide, obj.maxSlide);
        const [cx,cy] = slideCenterOfSim(obj);
        drawHazardBody(cx, cy, obj.radius, frame);
        break;
      }
      case "launcher": drawLauncherAtS(obj.x, obj.y, obj.angle, isSelected); break;
    }
  }

  // Ball (+ selection highlight when CLING is the crank target)
  const [bx,by] = sim.worldPos();
  const ballSelected = sel && sel.kind === "ball"
    && !sim.isDocked() && !sim.isInFlight() && !sim.isFalling();
  if (ballSelected) drawSelectionHighlightS(bx, by, g.frameCount);
  const flashHide = ball.respawnFlash > 0 && (ball.frameCount % 2) === 0;
  if (!flashHide){
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(bx,by,SIM.BALL_RADIUS,0,7); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(bx,by,SIM.BALL_RADIUS+1,0,7); ctx.stroke();
  }

  // HUD
  ctx.fillStyle = INK;
  ctx.font = "bold 9px ui-monospace, Menlo, Consolas, monospace";
  ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.fillText(`COINS ${g.coinsCollected}/${sim.totalCoins}`, 6, 5);
  ctx.fillText("R: RESTART", 6, 17);
  ctx.textAlign = "right";
  ctx.fillText(sim.selectionLabel(), 394, 5);
  ctx.textAlign = "left";

  // Tutorial bar
  if (g.tutorial && !g.levelComplete){
    ctx.fillStyle = INK;
    ctx.fillRect(0, 224, 400, 16);
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.fillText(g.tutorial, 200, 228);
    ctx.textAlign = "left";
  }

  // CLEAR overlay
  if (g.levelComplete){
    ctx.fillStyle = "rgba(255,255,255,.75)";
    ctx.fillRect(0, 84, 400, 76);
    ctx.fillStyle = INK;
    ctx.textAlign = "center";
    ctx.font = "bold 22px ui-monospace, Menlo, Consolas, monospace";
    ctx.fillText("CLEAR", 200, 96);
    ctx.font = "bold 11px ui-monospace, Menlo, Consolas, monospace";
    ctx.fillText("SCORE " + g.lastLevelScore, 200, 124);
    ctx.font = "9px ui-monospace, Menlo, Consolas, monospace";
    ctx.fillText("R restart · Esc back to editor", 200, 140);
    ctx.textAlign = "left";
  }
}
function slideCenterOfSim(o){
  const span = o.maxSlide - o.minSlide;
  const pix = span <= 0 ? o.minSlide : o.minSlide + o.objectPosition*span;
  const r = rad(o.slideAngle);
  return [o.x + Math.cos(r)*pix, o.y + Math.sin(r)*pix];
}


/* ---------- hit testing (screen space) ---------- */
function distToSeg(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1;
  const L2 = dx*dx+dy*dy;
  let t = L2 ? ((px-x1)*dx+(py-y1)*dy)/L2 : 0;
  t = Math.max(0,Math.min(1,t));
  const qx=x1+dx*t, qy=y1+dy*t;
  return Math.hypot(px-qx,py-qy);
}
function hitTest(sx,sy){
  // handles first (selected object)
  if (selIdx >= 0 && selIdx < level.objects.length){
    const o = level.objects[selIdx];
    const rh = rotHandlePos(o,selIdx);
    if (rh && Math.hypot(sx-rh[0],sy-rh[1]) <= 7) return {mode:"rotate", idx:selIdx};
    const sh = slideHandlePos(o);
    if (sh && Math.hypot(sx-sh[0],sy-sh[1]) <= 7) return {mode:"slideangle", idx:selIdx};
  }
  for (let i=level.objects.length-1; i>=0; i--){
    const o = level.objects[i];
    const [cx,cy] = bodyCenterScreen(o,i);
    let hit = false;
    if (o.type==="spawn") hit = Math.hypot(sx-cx,sy-cy) <= 10;
    else if (o.type==="exit") hit = Math.abs(sx-cx)<=11 && Math.abs(sy-cy)<=13;
    else if (o.type==="coin") hit = Math.hypot(sx-cx,sy-cy) <= 8;
    else if (o.type==="hazard"||o.type==="moving_hazard"||o.type==="bouncer")
      hit = Math.hypot(sx-cx,sy-cy) <= Math.max(8, o.radius||CFG.BOUNCER_RADIUS);
    else if (o.type==="launcher") hit = Math.hypot(sx-cx,sy-cy) <= 16;
    else if (BAR_TYPES.has(o.type)){
      const [x1,y1,x2,y2] = barEndpointsScreen(cx,cy,o.length,effAngle(o,i));
      const hw = (o.type==="deflector"||o.type==="sliding_wall") ? CFG.BAR_WIDTH/2+2 : 6;
      hit = distToSeg(sx,sy,x1,y1,x2,y2) <= hw;
    }
    if (hit) return {mode:"move", idx:i};
  }
  return null;
}

/* ---------- mutations, undo/redo, persistence ---------- */
function deepCopy(v){ return JSON.parse(JSON.stringify(v)); }
function snapshot(){ return {level: deepCopy(level), selIdx}; }
function pushUndo(){
  undoStack.push(snapshot());
  if (undoStack.length > 120) undoStack.shift();
  redoStack.length = 0;
}
function applySnap(s){
  level = deepCopy(s.level); selIdx = s.selIdx;
  syncLevelPanel(); refreshAll();
}
function undo(){ if(!undoStack.length) return; stopPlay(); redoStack.push(snapshot()); applySnap(undoStack.pop()); }
function redo(){ if(!redoStack.length) return; stopPlay(); undoStack.push(snapshot()); applySnap(redoStack.pop()); }
function saveLocal(){
  try{ localStorage.setItem("cling-editor-autosave", JSON.stringify(level)); }catch(e){}
}
function loadLocal(){
  try{
    const s = localStorage.getItem("cling-editor-autosave");
    if (s){
      const l = JSON.parse(s);
      if (l && Array.isArray(l.objects)){
        if (!Array.isArray(l.spikedEdges)) l.spikedEdges = [];
        level = l;
        return true;
      }
    }
  }catch(e){}
  return false;
}
function commit(){ saveLocal(); refreshAll(); }

/* ---------- validation ---------- */
function validate(){
  const errs = [], warns = [];
  const objs = level.objects;
  const crank = objs.filter(o=>CRANKABLE.has(o.type)).length;
  if (crank > 3) errs.push(`Too many crankables: ${crank} (deflector + sliding wall + launcher must be ≤ 3 — the game asserts).`);
  const spawns = objs.filter(o=>o.type==="spawn").length;
  if (spawns !== 1) errs.push(spawns===0 ? "No spawn — exactly one is required." : `Multiple spawns (${spawns}) — exactly one is required.`);
  const exits = objs.filter(o=>o.type==="exit");
  if (exits.length === 0) errs.push("No exit — at least one is required.");
  exits.forEach((o,k)=>{
    const onPerim = Math.abs(Math.abs(o.x)-180)<=2 || Math.abs(Math.abs(o.y)-100)<=2;
    const inside = Math.abs(o.x)<=182 && Math.abs(o.y)<=102;
    if (!onPerim || !inside) warns.push(`Exit at (${fmtNum(o.x)}, ${fmtNum(o.y)}) is not on the arena perimeter (x=±180 or y=±100).`);
  });
  objs.forEach((o,i)=>{
    const reach = objectReach(o) + (SLIDE_TYPES.has(o.type) ? slideSpan(o) : 0);
    if (Math.abs(o.x) > 180 + reach || Math.abs(o.y) > 100 + reach)
      warns.push(`#${i+1} ${o.type} at (${fmtNum(o.x)}, ${fmtNum(o.y)}) sits outside the arena beyond its reach.`);
  });
  return {errs, warns};
}
function renderWarnings(){
  const {errs, warns} = validate();
  const box = el("warnList");
  box.innerHTML = "";
  if (!errs.length && !warns.length){
    box.innerHTML = '<div class="warn-item ok">All checks pass.</div>';
    return;
  }
  for (const e of errs){ const d=document.createElement("div"); d.className="warn-item err"; d.textContent=e; box.appendChild(d); }
  for (const w of warns){ const d=document.createElement("div"); d.className="warn-item"; d.textContent=w; box.appendChild(d); }
}

/* ---------- properties panel ---------- */
function el(id){ return document.getElementById(id); }
function propNum(label, key, o, opts={}){
  const row = document.createElement("div"); row.className="prop-row";
  const lab = document.createElement("label"); lab.textContent = label;
  const inp = document.createElement("input"); inp.type="number";
  inp.step = opts.step ?? 1;
  if (opts.min !== undefined) inp.min = opts.min;
  if (opts.max !== undefined) inp.max = opts.max;
  inp.value = fmtNum(o[key] ?? 0);
  inp.addEventListener("change", ()=>{
    stopPlay(); pushUndo();
    let v = parseFloat(inp.value);
    if (!isFinite(v)) v = 0;
    if (opts.clamp) v = Math.max(opts.clamp[0], Math.min(opts.clamp[1], v));
    o[key] = v;
    inp.value = fmtNum(v);
    commit();
  });
  row.append(lab, inp);
  if (opts.after) row.append(opts.after);
  return row;
}
function segControl(options, current, onPick, labeler){
  const wrap = document.createElement("div"); wrap.className="seg";
  for (const opt of options){
    const b = document.createElement("button");
    b.textContent = labeler ? labeler(opt) : opt;
    if (opt === current) b.classList.add("on");
    b.addEventListener("click", ()=>{ onPick(opt); });
    wrap.appendChild(b);
  }
  return wrap;
}
function propSeg(label, key, o, options, applyFn){
  const row = document.createElement("div"); row.className="prop-row";
  const lab = document.createElement("label"); lab.textContent = label;
  row.append(lab, segControl(options, o[key], (opt)=>{
    stopPlay(); pushUndo();
    if (applyFn) applyFn(opt); else o[key] = opt;
    commit(); renderProps();
  }));
  return row;
}
function renderProps(){
  const box = el("props");
  box.innerHTML = "";
  if (selIdx < 0 || selIdx >= level.objects.length){
    box.innerHTML = '<div class="muted">Select an object.</div>';
    el("stSel").textContent = "nothing selected";
    return;
  }
  const o = level.objects[selIdx];
  el("stSel").textContent = `#${selIdx+1} ${o.type}`;
  const title = document.createElement("div");
  title.innerHTML = `<b>${o.type}</b> <span class="muted">#${selIdx+1}</span>`;
  title.style.marginBottom = "4px";
  box.appendChild(title);

  box.appendChild(propNum("x (center)", "x", o, {step:5}));
  box.appendChild(propNum("y (center, +up)", "y", o, {step:5}));

  const t = o.type;
  if (t==="hazard" || t==="moving_hazard" || t==="bouncer")
    box.appendChild(propNum("radius", "radius", o, {min:2}));
  if (t==="bouncer")
    box.appendChild(propNum("restitution", "restitution", o, {min:0, step:0.1}));
  if (t==="breakable_wall")
    box.appendChild(propNum("hp", "hp", o, {min:1, step:1}));
  if (BAR_TYPES.has(t)){
    const tbl = (t==="deflector") ? CFG.DEFLECTOR_SIZES : CFG.WALL_SIZES;
    const row = document.createElement("div"); row.className="prop-row";
    const lab = document.createElement("label"); lab.textContent="length";
    const inp = document.createElement("input"); inp.type="number"; inp.min=10; inp.value=fmtNum(o.length);
    inp.addEventListener("change", ()=>{
      stopPlay(); pushUndo();
      o.length = Math.max(10, parseFloat(inp.value)||tbl.M);
      commit();
    });
    row.append(lab, inp, segControl(["S","M","L"], letterOfLength(o.length,tbl), (L)=>{
      stopPlay(); pushUndo(); o.length = tbl[L]; commit(); renderProps();
    }, L=>`${L}·${tbl[L]}`));
    box.appendChild(row);
  }
  if (ANGLED.has(t))
    box.appendChild(propNum("angle °", "angle", o, {step:15}));
  if (t==="sweeper"){
    box.appendChild(propNum("minAngle °", "minAngle", o, {step:5}));
    box.appendChild(propNum("maxAngle °", "maxAngle", o, {step:5}));
  }
  if (t==="toggle_wall")
    box.appendChild(propNum("angleStep °", "angleStep", o, {step:15}));
  if (SLIDE_TYPES.has(t)){
    box.appendChild(propNum("slideAngle °", "slideAngle", o, {step:15}));
    box.appendChild(propSeg("slideRange", "slideRange", o, ["S","M","L"]));
    const row = document.createElement("div"); row.className="prop-row";
    const lab = document.createElement("label"); lab.textContent="objectPosition";
    const rng = document.createElement("input"); rng.type="range"; rng.min=0; rng.max=1; rng.step=0.05; rng.value=o.objectPosition;
    const num = document.createElement("input"); num.type="number"; num.min=0; num.max=1; num.step=0.05; num.value=o.objectPosition; num.style.width="55px";
    let posUndoArmed = true;
    const setPos = v=>{
      v = Math.max(0,Math.min(1, isFinite(v)?v:0.5));
      if (posUndoArmed){ stopPlay(); pushUndo(); posUndoArmed=false; setTimeout(()=>posUndoArmed=true, 800); }
      o.objectPosition = v; rng.value=v; num.value=v; saveLocal(); renderWarnings(); renderList();
    };
    rng.addEventListener("input", ()=>setPos(parseFloat(rng.value)));
    num.addEventListener("change", ()=>setPos(parseFloat(num.value)));
    row.append(lab, rng, num);
    box.appendChild(row);
  }
  if (t==="sweeper" || t==="toggle_wall" || t==="moving_wall" || t==="moving_hazard"){
    const tbl = t==="sweeper" ? CFG.SWEEPER_SPEEDS : t==="toggle_wall" ? CFG.TOGGLE_INTERVALS : CFG.MOVING_SPEEDS;
    const unit = t==="toggle_wall" ? "f" : "";
    box.appendChild(propSeg("speed", "speed", o, ["S","M","F"], null));
    const hint = document.createElement("div"); hint.className="hint";
    hint.textContent = t==="toggle_wall"
      ? `interval: S=${tbl.S} M=${tbl.M} F=${tbl.F} frames`
      : `S=${tbl.S} M=${tbl.M} F=${tbl.F}${unit}`;
    box.appendChild(hint);
  }
  if (o._extra){
    const d = document.createElement("div"); d.className="hint";
    d.textContent = "extra params kept for round-trip: " + Object.keys(o._extra).join(", ");
    box.appendChild(d);
  }
  // actions
  const act = document.createElement("div"); act.className="prop-row"; act.style.marginTop="8px";
  const bd = document.createElement("button"); bd.textContent="Duplicate";
  bd.addEventListener("click", ()=>duplicateSel());
  const bx = document.createElement("button"); bx.textContent="Delete";
  bx.addEventListener("click", ()=>deleteSel());
  act.append(bd,bx);
  box.appendChild(act);
}
function letterOfLength(len, tbl){
  for (const k of ["S","M","L"]) if (tbl[k]===len) return k;
  return null;
}

/* ---------- object list ---------- */
function renderList(){
  const ul = el("objList");
  ul.innerHTML = "";
  el("objCount").textContent = `(${level.objects.length})`;
  level.objects.forEach((o,i)=>{
    const li = document.createElement("li");
    li.draggable = true;
    if (i===selIdx) li.classList.add("sel");
    li.innerHTML = `<span class="idx">${i+1}</span><span class="typ">${o.type}</span><span class="pos">${fmtNum(o.x)}, ${fmtNum(o.y)}</span>`;
    li.addEventListener("click", ()=>{ selIdx = i; refreshSel(); });
    li.addEventListener("dragstart", e=>{ e.dataTransfer.setData("text/plain", String(i)); });
    li.addEventListener("dragover", e=>{ e.preventDefault(); li.classList.add("dragover"); });
    li.addEventListener("dragleave", ()=>li.classList.remove("dragover"));
    li.addEventListener("drop", e=>{
      e.preventDefault(); li.classList.remove("dragover");
      const from = parseInt(e.dataTransfer.getData("text/plain"),10);
      if (isNaN(from) || from===i) return;
      stopPlay(); pushUndo();
      const [moved] = level.objects.splice(from,1);
      level.objects.splice(i,0,moved);
      selIdx = i;
      commit();
    });
    ul.appendChild(li);
  });
}

/* ---------- selection helpers ---------- */
function refreshSel(){ renderProps(); renderList(); }
function refreshAll(){ renderProps(); renderList(); renderWarnings(); }
function duplicateSel(){
  if (selIdx<0) return;
  stopPlay(); pushUndo();
  const c = deepCopy(level.objects[selIdx]);
  c.x += 10; c.y -= 10;
  level.objects.splice(selIdx+1, 0, c);
  selIdx = selIdx+1;
  commit();
}
function deleteSel(){
  if (selIdx<0) return;
  stopPlay(); pushUndo();
  level.objects.splice(selIdx,1);
  selIdx = -1;
  commit();
}

/* ---------- mouse interaction ---------- */
function canvasScreenPos(e){
  const r = cv.getBoundingClientRect();
  return [(e.clientX-r.left)/2, (e.clientY-r.top)/2]; // 2× scale
}
const snapV = (v, fine)=> Math.round(v / (fine?1:5)) * (fine?1:5);
const snapA = (a, fine)=> { const s = fine?1:15; return ((Math.round(a/s)*s)%360+360)%360; };

cv.addEventListener("mousedown", e=>{
  if (testing) return;                 // test mode: canvas is the game screen
  const [sx,sy] = canvasScreenPos(e);
  if (playing) stopPlay();
  if (armedTool){
    const [cxx,cyy] = toCenter(sx,sy);
    pushUndo();
    const o = newObject(armedTool, snapV(cxx, e.shiftKey), snapV(cyy, e.shiftKey));
    level.objects.push(o);
    selIdx = level.objects.length-1;
    setArmed(null);
    commit();
    return;
  }
  const hit = hitTest(sx,sy);
  if (!hit){ selIdx = -1; refreshSel(); return; }
  selIdx = hit.idx;
  const o = level.objects[selIdx];
  if (hit.mode === "move"){
    drag = {mode:"move", idx:hit.idx, startSX:sx, startSY:sy, origX:o.x, origY:o.y, moved:false};
  } else if (hit.mode === "rotate"){
    drag = {mode:"rotate", idx:hit.idx, origAngle:o.angle||0, moved:false};
  } else if (hit.mode === "slideangle"){
    drag = {mode:"slideangle", idx:hit.idx, origAngle:o.slideAngle||0, moved:false};
  }
  refreshSel();
});
window.addEventListener("mousemove", e=>{
  const [sx,sy] = canvasScreenPos(e);
  const [ccx,ccy] = toCenter(sx,sy);
  if (sx>=0 && sx<=400 && sy>=0 && sy<=240)
    el("stCursor").textContent = `${Math.round(ccx)}, ${Math.round(ccy)}`;
  if (!drag) return;
  const o = level.objects[drag.idx];
  if (!o){ drag = null; return; }
  if (!drag.moved){ drag.moved = true; pushUndo(); }
  if (drag.mode === "move"){
    const dx = sx - drag.startSX, dy = sy - drag.startSY;
    o.x = snapV(drag.origX + dx, e.shiftKey);
    o.y = snapV(drag.origY - dy, e.shiftKey);   // screen dy → center-origin −dy
    renderList(); renderPropsSoft();
  } else if (drag.mode === "rotate"){
    const [cx,cy] = bodyCenterScreen(o, drag.idx);
    const a = Math.atan2(sy-cy, sx-cx)*180/Math.PI;
    o.angle = snapA(a, e.shiftKey);
    renderPropsSoft();
  } else if (drag.mode === "slideangle"){
    const [cx,cy] = toScreen(o.x,o.y);
    const a = Math.atan2(sy-cy, sx-cx)*180/Math.PI;
    o.slideAngle = snapA(a, e.shiftKey);
    renderPropsSoft();
  }
  renderWarnings();
});
window.addEventListener("mouseup", ()=>{
  if (drag && drag.moved) saveLocal();
  drag = null;
});
/* light-weight prop refresh during drags (rebuild only values) */
let propsSoftTimer = 0;
function renderPropsSoft(){
  const now = performance.now();
  if (now - propsSoftTimer < 80) return;
  propsSoftTimer = now;
  renderProps();
}

/* ---------- palette ---------- */
function setArmed(t){
  armedTool = t;
  document.querySelectorAll(".pal-btn").forEach(b=>{
    b.classList.toggle("armed", b.dataset.type === t);
  });
  cv.style.cursor = t ? "copy" : "crosshair";
  el("stMode").textContent = t ? `placing: ${t} — click the arena` : (playing?"PLAY":"");
}
document.querySelectorAll(".pal-btn").forEach(b=>{
  b.addEventListener("click", ()=>{
    stopPlay();
    setArmed(armedTool === b.dataset.type ? null : b.dataset.type);
  });
});

/* ---------- keyboard ---------- */
window.addEventListener("keydown", e=>{
  const tag = (e.target.tagName||"").toLowerCase();
  if (tag==="input" || tag==="textarea" || tag==="select") return;
  if (testing && testSim){
    if (e.key === "Shift"){ testKeys.add("Shift"); return; }
    switch(e.key){
      case "ArrowLeft": case "ArrowRight":
        e.preventDefault(); testKeys.add(e.key); return;
      case "a": case "d": case "A": case "D":
        e.preventDefault(); testKeys.add(e.key.toLowerCase()); return;
      case "ArrowUp": case " ":
        e.preventDefault(); testSim.selectCling(); return;
      case "ArrowDown": case "s": case "S":
        e.preventDefault();
        if (!testSim.game.levelComplete) testSim.tryDrop();
        return;
      case "Tab":
        e.preventDefault(); testSim.cycleObjects(e.shiftKey ? -1 : 1); return;
      case "q": case "Q":
        testSim.cycleObjects(-1); return;
      case "e": case "E":
        testSim.cycleObjects(1); return;
      case "r": case "R":
        testSim.restartLevel(); return;
      case "Escape":
        stopTest(); return;
    }
    return;
  }
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase()==="z"){
    e.preventDefault();
    if (e.shiftKey) redo(); else undo();
    return;
  }
  if (mod && e.key.toLowerCase()==="d"){
    e.preventDefault(); duplicateSel(); return;
  }
  if (e.key==="Escape"){
    if (armedTool) setArmed(null);
    else { selIdx=-1; refreshSel(); }
    return;
  }
  if (e.key==="Delete" || e.key==="Backspace"){
    if (selIdx>=0){ e.preventDefault(); deleteSel(); }
    return;
  }
  const step = e.shiftKey ? 1 : 5;
  let dx=0, dy=0;
  if (e.key==="ArrowLeft") dx=-step;
  else if (e.key==="ArrowRight") dx=step;
  else if (e.key==="ArrowUp") dy=step;      // center-origin Y-up
  else if (e.key==="ArrowDown") dy=-step;
  else return;
  if (selIdx<0) return;
  e.preventDefault();
  stopPlay(); pushUndo();
  const o = level.objects[selIdx];
  o.x += dx; o.y += dy;
  commit();
});

/* ---------- level meta panel ---------- */
function syncLevelPanel(){
  el("lvName").value = level.name || "";
  el("lvTheme").value = level.theme || "";
  el("lvCeiling").value = level.ceiling || "solid";
  el("lvTutorial").value = level.tutorial || "";
  const spikes = resolveArenaSpikes(level.ceiling, level.spikedEdges);
  el("spTop").checked = !!spikes.top;
  el("spBottom").checked = !!spikes.bottom;
  el("spLeft").checked = !!spikes.left;
  el("spRight").checked = !!spikes.right;
  // Top checkbox is driven by ceiling=spikes; disable when open (no top wall).
  el("spTop").disabled = level.ceiling === "open";
}
function bindMeta(id, key){
  el(id).addEventListener("change", ()=>{
    pushUndo();
    level[key] = el(id).value;
    commit();
  });
}
bindMeta("lvName","name"); bindMeta("lvTheme","theme"); bindMeta("lvTutorial","tutorial");
el("lvCeiling").addEventListener("change", ()=>{
  pushUndo();
  level.ceiling = el("lvCeiling").value;
  // Keep spikedEdges in sync with ceiling legacy: spikes unions top; open clears top.
  const set = new Set(normalizeSpikedEdges(level.spikedEdges));
  if (level.ceiling === "spikes") set.add("top");
  else set.delete("top");
  if (level.ceiling === "open") set.delete("top");
  level.spikedEdges = [...set];
  syncLevelPanel();
  commit();
});
function bindSpikeEdge(id, edge){
  el(id).addEventListener("change", ()=>{
    if (edge === "top" && level.ceiling === "open"){ el(id).checked = false; return; }
    pushUndo();
    const set = new Set(normalizeSpikedEdges(level.spikedEdges));
    if (el(id).checked) set.add(edge); else set.delete(edge);
    level.spikedEdges = [...set];
    // Mirror top into ceiling for legacy parity when only top changes.
    if (edge === "top"){
      if (el(id).checked && level.ceiling !== "open") level.ceiling = "spikes";
      else if (!el(id).checked && level.ceiling === "spikes") level.ceiling = "solid";
      el("lvCeiling").value = level.ceiling;
    }
    syncLevelPanel();
    commit();
  });
}
bindSpikeEdge("spTop","top");
bindSpikeEdge("spBottom","bottom");
bindSpikeEdge("spLeft","left");
bindSpikeEdge("spRight","right");

/* ---------- top-bar buttons ---------- */
el("btnPlay").addEventListener("click", ()=>{
  if (testing) stopTest();
  playing ? stopPlay() : (setArmed(null), startPlay());
});
el("btnTest").addEventListener("click", ()=>{
  testing ? stopTest() : startTest();
});
el("btnNew").addEventListener("click", ()=>{
  if (!confirm("Start a new empty level? (current level stays in undo history)")) return;
  stopPlay(); pushUndo();
  level = {name:"Untitled", theme:"Roll", ceiling:"solid", tutorial:"", spikedEdges:[], objects:[
    newObject("spawn", -160, -100),
    newObject("exit", 180, -100),
  ]};
  selIdx = -1;
  syncLevelPanel(); commit();
});
el("btnIO").addEventListener("click", ()=>{
  el("ioDrawer").classList.toggle("open");
});
el("btnCloseIO").addEventListener("click", ()=> el("ioDrawer").classList.remove("open"));
el("btnExport").addEventListener("click", ()=>{
  el("ioText").value = exportLevel(level);
  ioMsg("Exported. Paste into levels.lua.", false);
});
el("btnCopy").addEventListener("click", async ()=>{
  const t = el("ioText");
  if (!t.value) t.value = exportLevel(level);
  try{
    await navigator.clipboard.writeText(t.value);
    ioMsg("Copied to clipboard.", false);
  }catch(err){
    t.select(); document.execCommand("copy");
    ioMsg("Copied (fallback).", false);
  }
});
el("btnImport").addEventListener("click", ()=>{
  try{
    const {level: lv, notes} = importLevelFromLua(el("ioText").value);
    stopPlay(); pushUndo();
    level = lv; selIdx = -1;
    syncLevelPanel(); commit();
    ioMsg("Imported \""+lv.name+"\" — "+lv.objects.length+" objects." + (notes.length? " "+notes.join(" ") : ""), false);
  }catch(err){
    ioMsg(err.message, true);
  }
});
function ioMsg(msg, isErr){
  const m = el("ioMsg");
  m.textContent = msg;
  m.className = isErr ? "err" : "ok";
}

/* ---------- built-in level loader ---------- */
(function(){
  const sel = el("lvLoad");
  for (const it of BUILTIN_LEVELS){
    const opt = document.createElement("option");
    opt.value = String(it.n);
    opt.textContent = `L${it.n} · ${it.name}` + (it.theme ? `  (${it.theme})` : "");
    sel.appendChild(opt);
  }
  sel.addEventListener("change", ()=>{
    const n = parseInt(sel.value, 10);
    sel.value = "";                       // re-arm so the same level can be re-picked
    if (!n) return;
    const it = BUILTIN_LEVELS.find(x=>x.n===n);
    if (!it) return;
    try{
      const {level: lv} = importLevelFromLua(it.lua);
      stopPlay(); setArmed(null); pushUndo();
      level = lv; selIdx = -1;
      syncLevelPanel(); commit();
      el("stMode").textContent = `loaded built-in L${n} "${lv.name}" — previous level is in undo history`;
    }catch(err){
      alert("Failed to load built-in level: " + err.message);
    }
  });
})();

/* overlay toggles redraw automatically via rAF; nothing to bind */

/* ---------- boot ---------- */
if (!loadLocal()){
  level = {name:"Untitled", theme:"Roll", ceiling:"solid", tutorial:"", spikedEdges:[], objects:[
    newObject("spawn", -160, -100),
    newObject("exit", 180, -100),
  ]};
}
syncLevelPanel();
refreshAll();
requestAnimationFrame(loop);

})();
</script>
