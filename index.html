      }
    }
  }
  function checkExit(){
    if (exitReached) return;
    if (game.levelComplete) return;
    const [px,py] = worldPos();
    const r = SIM.EXIT_PICKUP;
    for (const obj of objects){
      if (obj.type === "exit"){
        const dx = obj.x - px, dy = obj.y - py;
        if (dx*dx + dy*dy < r*r){ exitReached = true; return; }

  function crawlerCenter(obj){
    if (obj.dead || !obj.host) return [obj.x, obj.y];
    const ri = railIndexOf(obj.host);
    if (!ri) return [obj.x, obj.y];
    const hostRail = game.rails[ri];
    if (!hostRail) return [obj.x, obj.y];
    return RL.pointAt(hostRail, obj.s);
  }
  function closedArcDist(a, b, length){
    if (!length || length <= 0) return 0;

    if (d > length * 0.5) d = length - d;
    return d;
  }
  /** Outline-aware crawler kill (mirrors cling_ball.crawlerKillsAt). */
  function crawlerKillsAt(obj, px, py){
    if (obj.dead) return false;
    const [cx,cy] = crawlerCenter(obj);
    const br = SIM.BALL_RADIUS;
    const hitR = (obj.radius ?? CFG.CRAWLER_RADIUS_DEFAULT ?? 9) + br;
    const dx = cx - px, dy = cy - py;
    if (dx*dx + dy*dy >= hitR*hitR) return false;
    const host = obj.host;
    if (!host) return true;
    const ri = railIndexOf(host);
    const hostRail = ri ? game.rails[ri] : null;
    if (!hostRail) return true;
    if (ball.mode === "cling" && ball.rail === ri){
      const sampleS = RL.closestPoint(hostRail, px, py).s;
      return closedArcDist(sampleS, obj.s || 0, RL.length(hostRail)) < hitR;
    }
    if (hostRail.kind === "bar_outline"){
      for (let t = 1; t <= 3; t++){
        const f = t * 0.25;
        const sx = px + (cx - px) * f, sy = py + (cy - py) * f;
        if (RL.pointInBar(hostRail, sx, sy, 0)) return false;
      }
    }
    return true;
  }
  function checkHazards(){
    if (ball.mode === "cling" && ball.rail === 1 && sOnSpikedArenaEdge(ball.s)){
      die(); return;

    const [px,py] = worldPos();
    const br = SIM.BALL_RADIUS;
    for (const obj of objects){
      if (obj.type === "crawler"){
        if (crawlerKillsAt(obj, px, py)){ die(); return; }
      } else if (obj.type === "hazard" || obj.type === "moving_hazard"
          || obj.type === "sliding_hazard"){
        let cx = obj.x, cy = obj.y;
        if (obj.type === "moving_hazard" || obj.type === "sliding_hazard")
          [cx,cy] = simSlideCenter(obj);
        const dx = cx - px, dy = cy - py;
        const hitR = (obj.radius ?? CFG.HAZARD_RADIUS_DEFAULT) + br;
        if (dx*dx + dy*dy < hitR*hitR){ die(); return; }
      }
    }
  }

  /* -------- game glue (main.lua) -------- */
  function buildRails(){
    game.rails = [null, arenaRailS(game.arenaCeiling)];
    game.railOwners = [null, null];
    for (const obj of objects){
      const r = simGetRail(obj);
      if (r){ game.rails.push(r); game.railOwners.push(obj); }
    }
    const inset = SIM.ARENA_INSET;
    const L = inset, T = inset;
    const R = CFG.SCREEN_W - inset, B = CFG.SCREEN_H - inset;
    const gapTol = SIM.JUNCTION_SNAP;
    const minFrac = SIM.EDGE_SEAL_MIN_OVERLAP ?? 0.5;
    const arena = game.rails[1];
    const seals = [];
    for (let i = 2; i < game.rails.length; i++){
      const found = RL.arenaEdgeSeals(game.rails[i], arena, L, T, R, B, gapTol, minFrac);
      for (const seal of found){
        seal.railIndex = i;
        seals.push(seal);
      }
    }
    game.arenaSeals = seals;
  }
  function railIndexOf(obj){
    for (let i=1;i<game.railOwners.length;i++){
      if (game.railOwners[i] === obj) return i;
    }
    return null;
  }
  function stepAutoMovers(){
    for (const obj of objects){
      obj._frameVx = 0; obj._frameVy = 0; obj._framePrevAngle = null;
    }
    for (const obj of objects){
      if (obj.type === "sweeper"){
        obj._framePrevAngle = obj.angle;
        obj.angle += obj._sweepDir * obj.speed;
        if (obj.angle >= obj.maxAngle){ obj.angle = obj.maxAngle; obj._sweepDir = -1; }
        else if (obj.angle <= obj.minAngle){ obj.angle = obj.minAngle; obj._sweepDir = 1; }
      } else if (obj.type === "moving_wall"){
        const [prevCx, prevCy] = simSlideCenter(obj);
        obj.objectPosition += obj._moveDir * obj.speed;
        if (obj.objectPosition >= 1){ obj.objectPosition = 1; obj._moveDir = -1; }
        else if (obj.objectPosition <= 0){ obj.objectPosition = 0; obj._moveDir = 1; }
        const [newCx, newCy] = simSlideCenter(obj);
        obj._frameVx = newCx - prevCx; obj._frameVy = newCy - prevCy;
      } else if (obj.type === "moving_hazard"){
        obj.objectPosition += obj._moveDir * obj.speed;
        if (obj.objectPosition >= 1){ obj.objectPosition = 1; obj._moveDir = -1; }
        else if (obj.objectPosition <= 0){ obj.objectPosition = 0; obj._moveDir = 1; }
      } else if (obj.type === "crawler"){
        if (obj.dead) continue;
        const host = obj.host;
        if (!host){ obj.dead = true; continue; }
        const ri = railIndexOf(host);
        if (!ri){ obj.dead = true; continue; }
        const hostRail = game.rails[ri];
        if (!hostRail){ obj.dead = true; continue; }
        const len = RL.length(hostRail);
        obj.s = crawlerAdvanceS(obj.s, obj.direction, obj.speed, len);
        obj.frameCount = (obj.frameCount || 0) + 1;
      } else if (obj.type === "toggle_wall"){
        obj._timer++;
        obj.frameCount = (obj.frameCount || 0) + 1;
        if (obj._timer >= obj.intervalFrames){
          obj._timer = 0;
          obj._k++;
          obj.angle = mod(obj.baseAngle + obj._k * obj.angleStep, 360);
          obj._justSnapped = true;
        }
      }
    }
  }
  function distPointToSegmentS(px, py, ax, ay, bx, by){
    const abx=bx-ax, aby=by-ay, apx=px-ax, apy=py-ay;
    const ab2 = abx*abx+aby*aby;
    let t = 0;
    if (ab2 > 1e-12){
      t = (apx*abx+apy*aby)/ab2;
      if (t<0) t=0; else if (t>1) t=1;
    }
    const qx=ax+abx*t, qy=ay+aby*t;
    return Math.hypot(px-qx, py-qy);
  }
  function segmentSegmentDistS(ax,ay,bx,by,cx,cy,dx,dy){
    const dot=(x1,y1,x2,y2)=>x1*x2+y1*y2;
    const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
    const ux=bx-ax, uy=by-ay, vx=dx-cx, vy=dy-cy, wx=ax-cx, wy=ay-cy;
    const a=dot(ux,uy,ux,uy), b=dot(ux,uy,vx,vy), c=dot(vx,vy,vx,vy);
    const d=dot(ux,uy,wx,wy), e=dot(vx,vy,wx,wy);
    const denom=a*c-b*b;
    let sc, tc;
    if (denom < 1e-12){ sc=0; tc=c>1e-12?clamp(dot(-wx,-wy,vx,vy)/c,0,1):0; }
    else { sc=clamp((b*e-c*d)/denom,0,1); tc=clamp((a*e-b*d)/denom,0,1); }
    const px=ax+sc*ux, py=ay+sc*uy, qx=cx+tc*vx, qy=cy+tc*vy;
    return Math.hypot(px-qx, py-qy);
  }
  function plateTopFaceSegmentS(plate){
    const dep = (plate.pressed || plate.latched) ? (SIM.PLATE_TRAVEL||3) : 0;
    let cx=plate.x, cy=plate.y;
    if (dep>0){ const a=rad(plate.angle||0); cx+=-Math.sin(a)*dep; cy+=Math.cos(a)*dep; }
    const ux=Math.cos(rad(plate.angle||0)), uy=Math.sin(rad(plate.angle||0));
    const px=-uy, py=ux;
    const hL=(plate.length||40)/2, hW=(SIM.PLATE_WIDTH||8)/2;
    return [
      cx+ux*(-hL)+px*(-hW), cy+uy*(-hL)+py*(-hW),
      cx+ux*hL+px*(-hW), cy+uy*hL+py*(-hW),
    ];
  }
  function detectPlateWeightS(plate){
    const [fx1,fy1,fx2,fy2] = plateTopFaceSegmentS(plate);
    const pressDist = SIM.PLATE_PRESS_DIST || 6;
    if (ball.mode === "cling"){
      const ri = railIndexOf(plate);
      if (ri && ball.rail === ri) return true;
      const [bx,by] = worldPos();
      if (distPointToSegmentS(bx,by,fx1,fy1,fx2,fy2) <= pressDist) return true;
    }
    for (const obj of objects){
      if (obj.type !== "deflector") continue;
      const rail = simGetRail(obj);
      if (!rail || !rail.pts || rail.pts.length < 2) continue;
      const p1=rail.pts[0], p2=rail.pts[1];
      if (segmentSegmentDistS(p1.x,p1.y,p2.x,p2.y,fx1,fy1,fx2,fy2) <= pressDist) return true;

  function stepPressurePlates(){
    const graceMax = SIM.PLATE_RELEASE_GRACE_FRAMES || 2;
    for (const plate of objects){
      if (plate.type !== "pressure_plate") continue;
      const raw = detectPlateWeightS(plate);
      if (raw){
        plate.releaseGrace = 0;
        if (!plate.pressed && !plate.latched){
          plate.pressed = true;
          plate.flashTimer = 1;
          if (plate.mode === "latch") plate.latched = true;
        }
      } else if (plate.pressed && plate.mode === "hold" && !plate.latched){
        plate.releaseGrace = (plate.releaseGrace||0) + 1;
        if (plate.releaseGrace > graceMax) plate.pressed = false;
      }
      if (plate.flashTimer > 0) plate.flashTimer--;
      plate.frameCount = (plate.frameCount||0)+1;
    }
    const speed = SIM.PLATE_DRIVE_SPEED || 0.02;
    for (const obj of objects){
      if (!obj.plateDriven || obj.plateId == null) continue;
      const plate = objects.find(p=>p.type==="pressure_plate" && p.link===obj.plateId);
      if (!plate) continue;
      const active = plate.pressed || plate.latched;
      const target = active ? obj.pressedPosition : obj.restPosition;
      const delta = target - obj.objectPosition;
      if (Math.abs(delta) < 0.0001) continue;
      const [prevCx,prevCy] = simSlideCenter(obj);
      if (delta > 0) obj.objectPosition += Math.min(speed, delta);
      else obj.objectPosition += Math.max(-speed, delta);
      const [newCx,newCy] = simSlideCenter(obj);

  function bindCrawlerHosts(){
    for (const obj of objects){
      if (obj.type !== "crawler") continue;

      for (let i = 2; i < game.rails.length; i++){
        const owner = game.railOwners[i];
        if (!owner || !SOLID_CRAWLER_HOSTS.has(owner.type)) continue;
        const cp = RL.closestPoint(game.rails[i], obj.x, obj.y);
        if (cp.d < bestD){ bestD = cp.d; bestOwner = owner; bestS = cp.s; }
      }
      if (!bestOwner){

      }
      obj.host = bestOwner;
      const ri = railIndexOf(bestOwner);
      const hostRail = ri ? game.rails[ri] : null;
      const len = hostRail ? RL.length(hostRail) : 0;
      if (obj.startPosition != null && len > 0){
        let frac = obj.startPosition;
        if (frac < 0) frac = 0; else if (frac > 1) frac = 1;
        obj.s = frac * len;

  function applyCrankToObject(obj, change){
    if (obj.plateDriven) return;

      const ri = railIndexOf(obj);
      if (ri && ball.rail === ri) sens *= SIM.BAR_RIDER_SCALE;
      const prevAngle = obj.angle;
      obj.angle = mod(obj.angle + change*sens, 360);   // DEFLECTOR_ANGLE_STEP is 0 (free rotate)

      const span = obj.maxSlide - obj.minSlide;

      obj.objectPosition += change * SIM.SLIDER_CRANK_SENS / span;
      if (obj.objectPosition < 0) obj.objectPosition = 0;
      else if (obj.objectPosition > 1) obj.objectPosition = 1;
      const [newCx, newCy] = simSlideCenter(obj);

    stepPressurePlates();

    buildRails();
    refreshOpenRailPolarity();
    for (const obj of objects){
      if (obj.type === "moving_wall"
        && ((obj._frameVx || 0) !== 0 || (obj._frameVy || 0) !== 0)){
        resolveSolidSweep(obj, obj._frameVx, obj._frameVy, false);
      } else if (obj.type === "sweeper" && obj._framePrevAngle != null
        && obj._framePrevAngle !== obj.angle){

      } else if (obj.type === "toggle_wall" && obj._justSnapped){

    else {

    if (isDocked()) return "CRANK: AIM · \u2191 FIRE";
    if (isInFlight()) return "FLIGHT";
    if (isFalling()) return "FALLING";
    if (game.selTarget === "cling") return "CRANK: CLING";
    if (game.selTarget === "L") return "CRANK: L GROUP";

}

  if (o.type==="crawler") return (o.radius||CFG.CRAWLER_RADIUS_DEFAULT||9)+5;
  if (o.type==="deflector") return o.length/2 + 8;
  if (BAR_TYPES.has(o.type)) return o.length/2;
  return 10;
}
/** Nearest SOLID host rail in screen space for editor overlays / mover preview. */
function editorCrawlerHostRail(o){
  let bestD = Infinity, bestRail = null;
  for (let hi = 0; hi < level.objects.length; hi++){
    const h = level.objects[hi];
    if (!SOLID_CRAWLER_HOSTS.has(h.type)) continue;
    let cx, cy, len, ang, bw;
    if (h.type === "sliding_wall" || h.type === "moving_wall"){
      [cx,cy] = slideBodyScreen(h, effPos(h, hi));
      len = h.length; ang = effAngle(h, hi);
      bw = h.type === "sliding_wall" ? CFG.BAR_WIDTH : CFG.WALL_WIDTH;
    } else {
      [cx,cy] = toScreen(h.x, h.y);
      len = h.length; ang = effAngle(h, hi); bw = CFG.WALL_WIDTH;
    }
    const rail = makeBarOutlineRailS(cx, cy, len, ang, bw);
    const [sx,sy] = toScreen(o.x, o.y);
    const cp = RL.closestPoint(rail, sx, sy);
    if (cp.d < bestD){ bestD = cp.d; bestRail = rail; }
  }
  return bestRail;
}
function drawOverlays(){
  const showKill = el("ovKill").checked;
  const showReach = el("ovReach").checked;
  const showSnap = el("ovSnap").checked;
  ctx.save();
  ctx.lineWidth = 1;

  if (showKill){
    for (let i=0;i<level.objects.length;i++){
      const o = level.objects[i];
      if (o.type === "hazard"){
        const [cx,cy]=toScreen(o.x,o.y);
        killCircles(cx,cy,o.radius);
      } else if (o.type === "moving_hazard" || o.type === "sliding_hazard"){
        for (const pos of [0,1]){
          const [cx,cy]=slideBodyScreen(o,pos);
          killCircles(cx,cy,o.radius);
        }
      } else if (o.type === "crawler"){
        const hostRail = editorCrawlerHostRail(o);
        const r = o.radius || CFG.CRAWLER_RADIUS_DEFAULT || 9;
        if (hostRail){
          const len = RL.length(hostRail);
          for (let s = 0; s < len; s += 12){
            const [cx,cy] = RL.pointAt(hostRail, s);
            killCircles(cx, cy, r);
          }
        } else {
          const [cx,cy] = toScreen(o.x, o.y);
          killCircles(cx, cy, r);
        }
      }
    }
  }
  if (showReach){
    for (const o of level.objects){
      if (o.type !== "deflector") continue;
      const [cx,cy]=toScreen(o.x,o.y);
      ctx.strokeStyle = "rgba(30,80,200,.55)";
      ctx.setLineDash([4,3]);
      ctx.beginPath(); ctx.arc(cx,cy,o.length/2+8,0,7); ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  if (showSnap){
    ctx.strokeStyle = "rgba(30,140,50,.6)";
    for (let i=0;i<level.objects.length;i++){
      const o = level.objects[i];
      const pts = [];
      if (BAR_TYPES.has(o.type)){
        const [cx,cy] = bodyCenterScreen(o,i);
        const [x1,y1,x2,y2] = barEndpointsScreen(cx,cy,o.length,effAngle(o,i));
        pts.push([x1,y1],[x2,y2]);
      }
      if (SLIDE_TYPES.has(o.type)){
        const [sx,sy]=toScreen(o.x,o.y);
        const sp=slideSpan(o), r=rad(o.slideAngle||0);
        pts.push([sx-Math.cos(r)*sp, sy-Math.sin(r)*sp],[sx+Math.cos(r)*sp, sy+Math.sin(r)*sp]);
      }
      for (const [px,py] of pts){
        ctx.beginPath(); ctx.arc(px,py,CFG.JUNCTION_SNAP,0,7); ctx.stroke();
      }
    }
  }
  ctx.restore();
}
function killCircles(cx,cy,r){
  ctx.strokeStyle = "rgba(200,30,30,.75)";
  ctx.beginPath(); ctx.arc(cx,cy,r+5,0,7); ctx.stroke();
  ctx.strokeStyle = "rgba(200,30,30,.22)";
  ctx.beginPath(); ctx.arc(cx,cy,r+30,0,7); ctx.stroke();
}
function drawGrid(){
  if (!el("ovGrid").checked) return;
  ctx.save();
  ctx.strokeStyle = "rgba(0,0,0,.07)";
  ctx.lineWidth = 0.5;
  for (let x=0;x<=400;x+=20){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,240); ctx.stroke(); }
  for (let y=0;y<=240;y+=20){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(400,y); ctx.stroke(); }
  ctx.strokeStyle = "rgba(0,0,0,.18)";
  ctx.beginPath(); ctx.moveTo(200,0); ctx.lineTo(200,240); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,120); ctx.lineTo(400,120); ctx.stroke();
  ctx.restore();
}
function drawSelection(){
  if (selIdx < 0 || selIdx >= level.objects.length) return;
  const o = level.objects[selIdx];
  const [cx,cy] = bodyCenterScreen(o,selIdx);
  ctx.save();
  // marching ants bounds
  let hw=12, hh=12;
  if (BAR_TYPES.has(o.type)){ hw = o.length/2+6; hh = hw; }
  if (o.type==="hazard"||o.type==="moving_hazard"||o.type==="sliding_hazard"){ hw=hh=(o.radius||CFG.HAZARD_RADIUS_DEFAULT)+6; }
  if (o.type==="crawler"){ hw=hh=(o.radius||CFG.CRAWLER_RADIUS_DEFAULT)+6; }
  ctx.strokeStyle = "rgba(216,129,0,.95)";
  ctx.lineWidth = 1;
  ctx.setLineDash([4,3]);
  ctx.lineDashOffset = -(frame%14)/2;
  ctx.beginPath(); ctx.arc(cx,cy,Math.max(hw,hh),0,7); ctx.stroke();
  ctx.setLineDash([]);
  // rotation handle
  const h = rotHandlePos(o,selIdx);
  if (h){
    ctx.strokeStyle = "rgba(216,129,0,.9)";
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(h[0],h[1]); ctx.stroke();
    ctx.fillStyle = "#d88100";
    ctx.beginPath(); ctx.arc(h[0],h[1],4.5,0,7); ctx.fill();
    ctx.strokeStyle = "#111";
    ctx.beginPath(); ctx.arc(h[0],h[1],4.5,0,7); ctx.stroke();
  }
  // slide-angle handle (square at rail + end)
  const sh = slideHandlePos(o);
  if (sh){
    ctx.fillStyle = "#d88100";
    ctx.fillRect(sh[0]-3.5, sh[1]-3.5, 7, 7);
    ctx.strokeStyle = "#111";
    ctx.strokeRect(sh[0]-3.5, sh[1]-3.5, 7, 7);
  }
  ctx.restore();
}
function rotHandlePos(o,i){
  if (!ANGLED.has(o.type)) return null;
  const [cx,cy] = bodyCenterScreen(o,i);
  const a = rad(effAngle(o,i));
  const d = (o.type==="launcher") ? 32 : o.length/2 + 14;
  return [cx+Math.cos(a)*d, cy+Math.sin(a)*d];
}
function slideHandlePos(o){
  if (!SLIDE_TYPES.has(o.type)) return null;
  const [sx,sy] = toScreen(o.x,o.y);
  const sp = slideSpan(o)+11, r = rad(o.slideAngle||0);
  return [sx+Math.cos(r)*sp, sy+Math.sin(r)*sp];
}

/* ---------- render loop ---------- */
function render(){
  ctx.setTransform(2,0,0,2,0,0);
  ctx.fillStyle = "#fff";
  ctx.fillRect(0,0,400,240);
  drawGrid();
  drawArena(level.ceiling, level.spikedEdges);
  for (let i=0;i<level.objects.length;i++) drawObject(level.objects[i], i);
  drawOverlays();
  if (!playing) drawSelection();
}
let acc = 0, lastT = 0;
function loop(t){
  if (!lastT) lastT = t;
  acc += (t-lastT)/1000; lastT = t;
  if (acc > 0.5) acc = 0.5;
  const stepDt = 1/CFG.FPS;
  while (acc >= stepDt){
    acc -= stepDt;
    frame++;
    if (testing && testSim){
      testSim.ball._jumpButtonHeld = testKeys.has("ArrowUp");
      testSim.handleCrank(consumeCrank());
      testSim.update();
    } else if (playing) stepMovers();
  }
  if (testing && testSim) drawSim(testSim);
  else render();
  requestAnimationFrame(loop);
}

/* ---------- play mode (step() ports) ---------- */
function startPlay(){
  runtime = level.objects.map(o=>{
    if (o.type==="sweeper")
      return {angle:o.angle||0, dir:1, speed:resolveSpeed("sweeper", o.speed)};
    if (o.type==="toggle_wall")
      return {angle:(((o.angle||0)%360)+360)%360, base:o.angle||0, k:0, timer:0,
              interval:resolveSpeed("toggle_wall", o.speed), step:o.angleStep??45,
              frameCount:0};
    if (o.type==="moving_wall"||o.type==="moving_hazard")
      return {pos:o.objectPosition, dir:(o.objectPosition >= 1-0.001)?-1:1,
              speed:resolveSpeed(o.type, o.speed)};
    if (o.type==="crawler"){
      const hostRail = editorCrawlerHostRail(o);
      let s = 0;
      if (hostRail){
        const len = RL.length(hostRail);
        if (typeof o.startPosition === "number" && len > 0)
          s = Math.max(0, Math.min(1, o.startPosition)) * len;
        else {
          const [sx,sy] = toScreen(o.x, o.y);
          s = RL.closestPoint(hostRail, sx, sy).s;
        }
      }
      return {s, dir:(o.direction===-1)?-1:1, speed:resolveSpeed("crawler", o.speed)};
    }
    return {};
  });
  playing = true;
  el("btnPlay").innerHTML = "&#9632; Stop";
  el("btnPlay").classList.add("active");
  el("stMode").textContent = "MOVERS — autonomous objects animating (editing paused)";
}
function stopPlay(){
  if (testing) stopTest();
  if (!playing) return;
  playing = false; runtime = null;
  el("btnPlay").innerHTML = "&#9654; Movers";
  el("btnPlay").classList.remove("active");
  el("stMode").textContent = "";
}
function stepMovers(){
  for (let i=0;i<level.objects.length;i++){
    const o = level.objects[i], rt = runtime[i];
    if (o.type==="sweeper"){
      rt.angle += rt.dir*rt.speed;
      const mn = o.minAngle??0, mx = o.maxAngle??90;
      if (rt.angle >= mx){ rt.angle = mx; rt.dir = -1; }
      else if (rt.angle <= mn){ rt.angle = mn; rt.dir = 1; }
    } else if (o.type==="toggle_wall"){
      rt.timer++;
      rt.frameCount = (rt.frameCount || 0) + 1;
      if (rt.timer >= rt.interval){
        rt.timer = 0; rt.k++;
        rt.angle = (((rt.base + rt.k*rt.step)%360)+360)%360;
      }
    } else if (o.type==="moving_wall"||o.type==="moving_hazard"){
      rt.pos += rt.dir*rt.speed;
      if (rt.pos >= 1){ rt.pos = 1; rt.dir = -1; }
      else if (rt.pos <= 0){ rt.pos = 0; rt.dir = 1; }
    } else if (o.type==="crawler" && rt.s !== undefined){
      const hostRail = editorCrawlerHostRail(o);
      const len = hostRail ? RL.length(hostRail) : 0;
      rt.s = crawlerAdvanceS(rt.s, rt.dir, rt.speed, len);
    }
  }
}

/* ---------- TEST MODE (gameplay simulation) ---------- */
let testing = false, testSim = null;
let wheelAccum = 0;
const testKeys = new Set();
const KEY_CRANK_DEG = 9, KEY_CRANK_FINE = 3;

function startTest(){
  const crank = level.objects.filter(o=>CRANKABLE.has(o.type) && o.plateId == null).length;
  if (crank > 4){
    alert("Can't test: "+crank+" crankables (deflector + sliding wall + sliding hazard). The game asserts a max of 4.");
    return;
  }
  stopPlay();           // also stops any previous test
  setArmed(null);
  selIdx = -1; refreshSel();
  testSim = createClingSim(deepCopy(level));
  testing = true;
  wheelAccum = 0; testKeys.clear();
  el("btnTest").innerHTML = "&#9632; Stop test";
  el("btnTest").classList.add("active");
  el("stMode").innerHTML = "TEST — <b>wheel / &#8592;&#8594;</b> crank &nbsp;<b>&#8593;</b> CLING/FIRE &nbsp;<b>&#8595;</b> drop &nbsp;<b>Q/E</b> group L/R &nbsp;<b>R</b> restart &nbsp;<b>Esc</b> exit";
  cv.style.cursor = "default";
  cv.focus && cv.focus();
}
function stopTest(){
  if (!testing) return;
  testing = false; testSim = null;
  testKeys.clear(); wheelAccum = 0;
  el("btnTest").innerHTML = "&#127918; Test";
  el("btnTest").classList.remove("active");
  el("stMode").textContent = "";
  cv.style.cursor = "crosshair";
}
function consumeCrank(){
  let c = 0;
  const fine = testKeys.has("Shift");
  const rate = fine ? KEY_CRANK_FINE : KEY_CRANK_DEG;
  if (testKeys.has("ArrowRight") || testKeys.has("d")) c += rate;
  if (testKeys.has("ArrowLeft") || testKeys.has("a")) c -= rate;
  if (wheelAccum !== 0){
    const take = Math.max(-40, Math.min(40, wheelAccum));
    wheelAccum -= take;
    if (Math.abs(wheelAccum) < 0.01) wheelAccum = 0;
    c += take;
  }
  return c;
}
cv.addEventListener("wheel", e=>{
  if (!testing) return;
  e.preventDefault();
  wheelAccum += e.deltaY * 0.35;
  if (wheelAccum > 240) wheelAccum = 240;
  if (wheelAccum < -240) wheelAccum = -240;
}, {passive:false});

window.addEventListener("keyup", e=>{
  testKeys.delete(e.key);
  testKeys.delete(e.key.toLowerCase());
});
window.addEventListener("blur", ()=>testKeys.clear());

/* ---------- test-mode drawing (ports of game.drawGame + clingball.draw) --- */
function drawSelectionHighlightS(cx,cy,frameCount){
  for (const offset of [0,15]){
    const progress = (frameCount + offset) % 30;
    const t = progress/30;
    const radius = 5 + t*15;
    const lw = Math.max(1, Math.floor(3 - t*2 + 0.5));
    const alpha = 0.3 + t*0.55;
    ctx.strokeStyle = dither(alpha);
    ctx.lineWidth = lw;
    ctx.beginPath(); ctx.arc(cx,cy,Math.floor(radius+0.5),0,7); ctx.stroke();
  }
  ctx.lineWidth = 1;
}
function drawArenaSeals(sim){
  const seals = sim.game.arenaSeals;
  const arena = sim.game.rails && sim.game.rails[1];
  if (!seals || !seals.length || !arena) return;
  const arenaLen = RL.length(arena);
  if (arenaLen <= 0) return;
  ctx.strokeStyle = dither(0.35);
  ctx.lineWidth = 3;
  ctx.setLineDash([4, 3]);
  for (const seal of seals){
    const spanLen = mod(seal.s1 - seal.s0, arenaLen);
    const steps = Math.max(4, Math.floor(spanLen / 3));
    ctx.beginPath();
    for (let i = 0; i <= steps; i++){
      const t = i / steps;
      let s = seal.s0 + spanLen * t;
      if (arena.closed) s = mod(s, arenaLen);
      const [x,y] = RL.pointAt(arena, s);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.lineWidth = 1;
}
function drawPressurePlateAtS(plate){
  const dep = (plate.pressed || plate.latched) ? (SIM.PLATE_TRAVEL||3) : 0;
  let cx = plate.x, cy = plate.y;
  if (dep > 0){ const a=rad(plate.angle||0); cx+=-Math.sin(a)*dep; cy+=Math.cos(a)*dep; }
  const ux=Math.cos(rad(plate.angle||0)), uy=Math.sin(rad(plate.angle||0));
  const px=-uy, py=ux;
  const hL=(plate.length||40)/2, hW=(SIM.PLATE_WIDTH||8)/2;
  const footW=Math.min(6,hW*0.9), footDrop=5;
  const corner=(along,perp)=>[cx+ux*along+px*perp, cy+uy*along+py*perp];
  const [x1,y1]=corner(-hL,-hW), [x2,y2]=corner(hL,-hW);
  const [x3,y3]=corner(hL,hW), [x4,y4]=corner(-hL,hW);
  if (plate.flashTimer > 0){ ctx.fillStyle="#fff"; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.lineTo(x4,y4); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle=INK;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.lineTo(x4,y4); ctx.closePath(); ctx.fill();
  ctx.strokeStyle=INK; ctx.lineWidth=1; ctx.stroke();
  const drawFoot=(fa,fb)=>{
    const [a1,b1]=corner(fa,hW), [a2,b2]=corner(fb,hW);
    const [a3,b3]=corner(fb,hW+footDrop), [a4,b4]=corner(fa,hW+footDrop);
    ctx.beginPath(); ctx.moveTo(a1,b1); ctx.lineTo(a2,b2); ctx.lineTo(a3,b3); ctx.lineTo(a4,b4); ctx.closePath(); ctx.fill();
  };
  drawFoot(-footW, footW);
  drawFoot(-hL+footW, -hL+footW*3);
  drawFoot(hL-footW*3, hL-footW);
  drawLinkBadgeAtS(cx, cy, plate.link);
}
function drawSlideRailSim(obj){
  drawSlideRailAtS(obj.x, obj.y, obj.slideAngle, obj.minSlide, obj.maxSlide, slideVisualExtent(obj));
  if (obj.plateId == null) return;
  const r = rad(obj.slideAngle||0);
  const span = obj.maxSlide - obj.minSlide;
  const pix = obj.minSlide + (obj.pressedPosition ?? 1) * span;
  const pex = obj.x + Math.cos(r)*pix, pey = obj.y + Math.sin(r)*pix;
  const ax = pex + Math.cos(r)*6, ay = pey + Math.sin(r)*6;
  ctx.strokeStyle = dither(0.75); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pex,pey); ctx.lineTo(ax,ay); ctx.stroke();
  ctx.fillStyle = INK;
  ctx.beginPath();
  const tx=Math.cos(r), ty=Math.sin(r), nx=-ty, ny=tx;
  ctx.moveTo(ax,ay);
  ctx.lineTo(ax-tx*4+nx*2, ay-ty*4+ny*2);
  ctx.lineTo(ax-tx*4-nx*2, ay-ty*4-ny*2);
  ctx.closePath(); ctx.fill();
  const midPix = (obj.minSlide + obj.maxSlide) * 0.5;
  drawLinkBadgeAtS(obj.x + Math.cos(r)*midPix, obj.y + Math.sin(r)*midPix, obj.plateId);
}
function drawSim(sim){
  ctx.setTransform(2,0,0,2,0,0);
  ctx.fillStyle = "#fff";
  ctx.fillRect(0,0,400,240);
  const g = sim.game, ball = sim.ball;
  drawArena(g.arenaCeiling, spikedEdgesList(g.arenaSpikes || {}));
  drawArenaSeals(sim);

  const docked = sim.isDocked() ? ball.dockedLauncher : null;
  for (const obj of sim.objects){
    // Launchers highlight only while docked (never via L/R group select).
    let isSelected = obj.type === "launcher"
      ? (docked === obj)
      : !!(obj.group && !obj.plateDriven && g.selTarget === obj.group);
    switch(obj.type){
      case "spawn": drawSpawnAtS(obj.x, obj.y); break;
      case "exit": drawExitAtS(obj.x, obj.y); break;
      case "coin": if (!obj.collected) drawCoinAtS(obj.x, obj.y); break;
      case "hazard": drawHazardBody(obj.x, obj.y, obj.radius, frame); break;
      case "wall":
        drawWallBody(obj.x, obj.y, obj.length, obj.angle); break;
      case "toggle_wall":
        drawWallBody(obj.x, obj.y, obj.length, obj.angle);
        drawToggleWallClock(obj.x, obj.y, obj._timer, obj.intervalFrames, obj.frameCount || 0);
        break;
      case "crawler": {
        if (obj.dead) break;
        let px = obj.x, py = obj.y;
        if (obj.host){
          const owners = g.railOwners || [];
          let ri = -1;
          for (let i = 1; i < owners.length; i++) if (owners[i] === obj.host){ ri = i; break; }
          if (ri > 0 && g.rails[ri]){
            const dir = obj.direction || 1;
            const s = obj.s || 0;
            ctx.fillStyle = INK;
            for (let k = 1; k <= 3; k++){
              const [tx,ty] = RL.pointAt(g.rails[ri], s - dir * k * 6);
              ctx.beginPath(); ctx.arc(tx, ty, 1, 0, 7); ctx.fill();
            }
            [px,py] = RL.pointAt(g.rails[ri], s);
          }
        }
        drawHazardBody(px, py, obj.radius, (obj.frameCount || frame) * (obj.direction || 1));
        break;
      }
      case "sweeper": drawSweeperAtS(obj.x, obj.y, obj.length, obj.angle); break;
      case "deflector": drawDeflectorAtS(obj.x, obj.y, obj.length, obj.angle, isSelected, obj.group); break;
      case "sliding_wall": {
        drawSlideRailSim(obj);
        const [cx,cy] = slideCenterOfSim(obj);
        drawWallBody(cx, cy, obj.length, obj.angle, isSelected ? 7 : undefined, CFG.BAR_WIDTH);
        if (!obj.plateDriven) drawGroupBadgeAtS(cx, cy, obj.group, isSelected);
        break;
      }
      case "moving_wall": {
        drawSlideRailAtS(obj.x, obj.y, obj.slideAngle, obj.minSlide, obj.maxSlide, slideVisualExtent(obj));
        const [cx,cy] = slideCenterOfSim(obj);
        drawWallBody(cx, cy, obj.length, obj.angle);
        break;
      }
      case "moving_hazard": {
        drawSlideRailAtS(obj.x, obj.y, obj.slideAngle, obj.minSlide, obj.maxSlide, slideVisualExtent(obj));
        const [cx,cy] = slideCenterOfSim(obj);
        drawHazardBody(cx, cy, obj.radius, frame);
        break;
      }
      case "sliding_hazard": {
        drawSlideRailSim(obj);
        const [cx,cy] = slideCenterOfSim(obj);
        drawHazardBody(cx, cy, obj.radius, frame);
        if (!obj.plateDriven) drawGroupBadgeAtS(cx, cy, obj.group, isSelected);
        break;
      }
      case "pressure_plate": drawPressurePlateAtS(obj); break;
      case "launcher": drawLauncherAtS(obj.x, obj.y, obj.angle, isSelected); break;
      case "sign": drawSignAtS(obj.x, obj.y, isSelected); break;
    }
  }

  // Ball (+ selection highlight when CLING is the crank target)
  const [bx,by] = sim.worldPos();
  const ballSelected = g.selTarget === "cling"
    && !sim.isDocked() && !sim.isInFlight() && !sim.isFalling();
  if (ballSelected) drawSelectionHighlightS(bx, by, g.frameCount);
  const flashHide = ball.respawnFlash > 0 && (ball.frameCount % 2) === 0;
  if (!flashHide){
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(bx,by,SIM.BALL_RADIUS,0,7); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(bx,by,SIM.BALL_RADIUS+1,0,7); ctx.stroke();
  }

  // HUD
  ctx.fillStyle = INK;
  ctx.font = "bold 9px ui-monospace, Menlo, Consolas, monospace";
  ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.fillText(`COINS ${g.coinsCollected}/${sim.totalCoins}`, 6, 5);
  ctx.fillText("R: RESTART", 6, 17);
  ctx.textAlign = "right";
  ctx.fillText(sim.selectionLabel(), 394, 5);
  ctx.textAlign = "left";

  // Tutorial bar
  if (g.tutorial && !g.levelComplete){
    ctx.fillStyle = INK;

function slideCenterOfSim(o){
  const span = o.maxSlide - o.minSlide;
  const pix = span <= 0 ? o.minSlide : o.minSlide + o.objectPosition*span;
  const r = rad(o.slideAngle);
  return [o.x + Math.cos(r)*pix, o.y + Math.sin(r)*pix];
}


/* ---------- hit testing (screen space) ---------- */
function distToSeg(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1;
  const L2 = dx*dx+dy*dy;
  let t = L2 ? ((px-x1)*dx+(py-y1)*dy)/L2 : 0;
  t = Math.max(0,Math.min(1,t));
  const qx=x1+dx*t, qy=y1+dy*t;
  return Math.hypot(px-qx,py-qy);
}
function hitTest(sx,sy){
  // handles first (selected object)
  if (selIdx >= 0 && selIdx < level.objects.length){
    const o = level.objects[selIdx];
    const rh = rotHandlePos(o,selIdx);
    if (rh && Math.hypot(sx-rh[0],sy-rh[1]) <= 7) return {mode:"rotate", idx:selIdx};
    const sh = slideHandlePos(o);
    if (sh && Math.hypot(sx-sh[0],sy-sh[1]) <= 7) return {mode:"slideangle", idx:selIdx};
  }
  for (let i=level.objects.length-1; i>=0; i--){
    const o = level.objects[i];
    const [cx,cy] = bodyCenterScreen(o,i);
    let hit = false;
    if (o.type==="spawn") hit = Math.hypot(sx-cx,sy-cy) <= 10;
    else if (o.type==="exit") hit = Math.abs(sx-cx)<=11 && Math.abs(sy-cy)<=13;
    else if (o.type==="coin") hit = Math.hypot(sx-cx,sy-cy) <= 8;
    else if (o.type==="hazard"||o.type==="moving_hazard"||o.type==="sliding_hazard"||o.type==="crawler")
      hit = Math.hypot(sx-cx,sy-cy) <= Math.max(8, o.radius||(o.type==="crawler"?CFG.CRAWLER_RADIUS_DEFAULT:CFG.HAZARD_RADIUS_DEFAULT));
    else if (o.type==="launcher") hit = Math.hypot(sx-cx,sy-cy) <= 16;
    else if (o.type==="sign") hit = Math.hypot(sx-cx,sy-cy) <= 12;
    else if (BAR_TYPES.has(o.type)){
      const [x1,y1,x2,y2] = barEndpointsScreen(cx,cy,o.length,effAngle(o,i));
      const hw = (o.type==="deflector"||o.type==="sliding_wall") ? CFG.BAR_WIDTH/2+2 : 6;
      hit = distToSeg(sx,sy,x1,y1,x2,y2) <= hw;
    }
    if (hit) return {mode:"move", idx:i};
  }
  return null;
}

/* ---------- mutations, undo/redo, persistence ---------- */
function deepCopy(v){ return JSON.parse(JSON.stringify(v)); }
function snapshot(){ return {level: deepCopy(level), selIdx}; }
function pushUndo(){
  undoStack.push(snapshot());
  if (undoStack.length > 120) undoStack.shift();
  redoStack.length = 0;
}
function applySnap(s){
  level = deepCopy(s.level); selIdx = s.selIdx;
  syncLevelPanel(); refreshAll();
}
function undo(){ if(!undoStack.length) return; stopPlay(); redoStack.push(snapshot()); applySnap(undoStack.pop()); }
function redo(){ if(!redoStack.length) return; stopPlay(); undoStack.push(snapshot()); applySnap(redoStack.pop()); }
function saveLocal(){
  try{ localStorage.setItem("cling-editor-autosave", JSON.stringify(level)); }catch(e){}
}
function migrateLetterFields(lvl){
  let changed = false;
  for (const o of lvl.objects || []){
    if (SLIDE_TYPES.has(o.type) && typeof o.slideRange === "string"){
      const n = CFG.LEGACY_SLIDER_SPANS[o.slideRange];
      if (n != null){ o.slideRange = n; changed = true; }
    }
    if (("speed" in o) && typeof o.speed === "string"
        && (o.type==="sweeper"||o.type==="toggle_wall"||o.type==="moving_wall"||o.type==="moving_hazard")){
      const n = speedTableForType(o.type)[o.speed];
      if (n != null){ o.speed = n; changed = true; }
    }
    // crawler keeps letter speed ("S"|"M"|"F") for Lua round-trip — do not numericize.
  }
  return changed;
}
function loadLocal(){
  try{
    const s = localStorage.getItem("cling-editor-autosave");
    if (s){
      const l = JSON.parse(s);
      if (l && Array.isArray(l.objects)){
        if (!Array.isArray(l.spikedEdges)) l.spikedEdges = [];
        const migrated = migrateLetterFields(l);
        level = l;
        if (migrated) saveLocal();
        return true;
      }
    }
  }catch(e){}
  return false;
}
function commit(){ saveLocal(); refreshAll(); }

/* ---------- validation ---------- */
function validate(){
  const errs = [], warns = [];
  const objs = level.objects;
  const crank = objs.filter(o=>CRANKABLE.has(o.type) && o.plateId == null).length;
  if (crank > 4) errs.push(`Too many crankables: ${crank} (deflector + sliding wall + sliding hazard must be ≤ 4 — the game asserts).`);
  const spawns = objs.filter(o=>o.type==="spawn").length;
  if (spawns !== 1) errs.push(spawns===0 ? "No spawn — exactly one is required." : `Multiple spawns (${spawns}) — exactly one is required.`);
  const exits = objs.filter(o=>o.type==="exit");
  if (exits.length === 0) errs.push("No exit — at least one is required.");
  exits.forEach((o,k)=>{
    const onPerim = Math.abs(Math.abs(o.x)-180)<=2 || Math.abs(Math.abs(o.y)-100)<=2;
    const inside = Math.abs(o.x)<=182 && Math.abs(o.y)<=102;
    if (!onPerim || !inside) warns.push(`Exit at (${fmtNum(o.x)}, ${fmtNum(o.y)}) is not on the arena perimeter (x=±180 or y=±100).`);
  });
  objs.forEach((o,i)=>{
    const reach = objectReach(o) + (SLIDE_TYPES.has(o.type) ? slideSpan(o) : 0);
    if (Math.abs(o.x) > 180 + reach || Math.abs(o.y) > 100 + reach)
      warns.push(`#${i+1} ${o.type} at (${fmtNum(o.x)}, ${fmtNum(o.y)}) sits outside the arena beyond its reach.`);
  });

  // L/R group authoring checks
  const grouped = { L: [], R: [] };
  objs.forEach((o,i)=>{
    if (!CRANKABLE.has(o.type) || o.plateId != null) return;
    if (o.group !== "L" && o.group !== "R"){
      warns.push(`#${i+1} ${o.type} has no group (L/R) — game will assign by x sign.`);
      return;
    }
    grouped[o.group].push({o,i});
  });
  for (const g of ["L","R"]){
    const members = grouped[g];
    if (!members.length) continue;
    const wrongSide = members.every(({o}) => g === "L" ? o.x >= 0 : o.x < 0);
    if (wrongSide){
      warns.push(`Group ${g}: all members sit on the ${g==="L"?"right":"left"} side (soft style hint).`);
    }
  }

  const plateLinks = {}, plateTargets = {};
  objs.forEach((o,i)=>{
    if (o.type === "pressure_plate"){
      if (o.link == null) warns.push(`#${i+1} pressure_plate missing link id.`);
      else if (plateLinks[o.link]) warns.push(`Duplicate pressure_plate link ${o.link}.`);
      else plateLinks[o.link] = true;
    }
    if (o.plateId != null){
      if (o.type !== "sliding_wall" && o.type !== "sliding_hazard")
        warns.push(`#${i+1} plateId on invalid type ${o.type}.`);
      if (o.group != null)
        warns.push(`#${i+1} plate-driven ${o.type} must not have group.`);
      plateTargets[o.plateId] = (plateTargets[o.plateId]||0)+1;
    }
  });
  for (const link of Object.keys(plateLinks)){
    const n = Number(link);
    if ((plateTargets[n]||0) !== 1)
      warns.push(`pressure_plate link ${n} must match exactly one driven object with plateId=${n}.`);
  }
  for (const [pid,count] of Object.entries(plateTargets)){
    if (!plateLinks[pid]) warns.push(`plateId ${pid} has no matching pressure_plate link.`);
    if (count > 1) warns.push(`Duplicate plateId ${pid} on driven objects.`);
  }

  // Flush long-face seals (intentional; blocks perimeter slip-through in play).
  const infos = [];
  const inset = CFG.ARENA_INSET;
  const aL = inset, aT = inset, aR = CFG.SCREEN_W - inset, aB = CFG.SCREEN_H - inset;
  objs.forEach((o,i)=>{
    if (!["wall","toggle_wall","moving_wall","sliding_wall"].includes(o.type)) return;
    let cx, cy;
    if (SLIDE_TYPES.has(o.type)){
      const [sx,sy] = toScreen(o.x, o.y);
      const span = slideSpan(o);
      const pos = Math.max(0, Math.min(1, o.objectPosition ?? 0.5));
      const pix = -span + pos * (2*span);
      const r = rad(o.slideAngle || 0);
      cx = sx + Math.cos(r)*pix; cy = sy + Math.sin(r)*pix;
    } else {
      [cx,cy] = toScreen(o.x, o.y);
    }
    const w = (o.type === "sliding_wall") ? CFG.BAR_WIDTH : CFG.WALL_WIDTH;
    const len = o.length ?? CFG.WALL_SIZES[o.size || "M"] ?? CFG.WALL_SIZES.M;
    const rail = makeBarOutlineRailS(cx, cy, len, o.angle || 0, w);
    const arena = arenaRailS("solid");
    const seals = RL.arenaEdgeSeals(
      rail, arena, aL, aT, aR, aB, CFG.JUNCTION_SNAP, SIM.EDGE_SEAL_MIN_OVERLAP ?? 0.5);
    for (const seal of seals){
      infos.push(`#${i+1} ${o.type} seals ${seal.edge} edge (flush — no slip-through)`);
    }
  });
  return {errs, warns, infos};
}
function renderWarnings(){
  const {errs, warns, infos} = validate();
  const box = el("warnList");
  box.innerHTML = "";
  if (!errs.length && !warns.length && !(infos && infos.length)){
    box.innerHTML = '<div class="warn-item ok">All checks pass.</div>';
    return;
  }
  for (const e of errs){ const d=document.createElement("div"); d.className="warn-item err"; d.textContent=e; box.appendChild(d); }
  for (const w of warns){ const d=document.createElement("div"); d.className="warn-item"; d.textContent=w; box.appendChild(d); }
  for (const info of (infos || [])){
    const d=document.createElement("div"); d.className="warn-item ok"; d.textContent=info; box.appendChild(d);
  }
}

/* ---------- properties panel ---------- */
function el(id){ return document.getElementById(id); }
function propNum(label, key, o, opts={}){
  const row = document.createElement("div"); row.className="prop-row";
  const lab = document.createElement("label"); lab.textContent = label;
  const inp = document.createElement("input"); inp.type="number";
  inp.step = opts.step ?? 1;
  if (opts.min !== undefined) inp.min = opts.min;
  if (opts.max !== undefined) inp.max = opts.max;
  inp.value = fmtNum(o[key] ?? 0);
  inp.addEventListener("change", ()=>{
    stopPlay(); pushUndo();
    let v = parseFloat(inp.value);
    if (!isFinite(v)) v = 0;
    if (opts.clamp) v = Math.max(opts.clamp[0], Math.min(opts.clamp[1], v));
    o[key] = v;
    inp.value = fmtNum(v);
    commit();
  });

}
function segControl(options, current, onPick, labeler){

    const b = document.createElement("button");
    b.textContent = labeler ? labeler(opt) : opt;
    if (opt === current) b.classList.add("on");

    wrap.appendChild(b);
  }
  return wrap;
}

function letterOfLength(len, tbl){ return letterOfValue(len, tbl); }
function letterOfValue(val, tbl){
  const keys = Object.keys(tbl);
  for (const k of keys) if (tbl[k] === val) return k;
  return null;
}

/* ---------- object list ---------- */
function renderList(){
  const ul = el("objList");
  ul.innerHTML = "";
  el("objCount").textContent = `(${level.objects.length})`;
  level.objects.forEach((o,i)=>{
    const li = document.createElement("li");
    li.draggable = true;
    if (i===selIdx) li.classList.add("sel");
    li.innerHTML = `<span class="idx">${i+1}</span><span class="typ">${o.type}</span><span class="pos">${fmtNum(o.x)}, ${fmtNum(o.y)}</span>`;
    li.addEventListener("click", ()=>{ selIdx = i; refreshSel(); });
    li.addEventListener("dragstart", e=>{ e.dataTransfer.setData("text/plain", String(i)); });
    li.addEventListener("dragover", e=>{ e.preventDefault(); li.classList.add("dragover"); });
    li.addEventListener("dragleave", ()=>li.classList.remove("dragover"));
    li.addEventListener("drop", e=>{
      e.preventDefault(); li.classList.remove("dragover");
      const from = parseInt(e.dataTransfer.getData("text/plain"),10);
      if (isNaN(from) || from===i) return;
      stopPlay(); pushUndo();
      const [moved] = level.objects.splice(from,1);
      level.objects.splice(i,0,moved);
      selIdx = i;
      commit();
    });
    ul.appendChild(li);
  });
}

/* ---------- selection helpers ---------- */
function refreshSel(){ renderProps(); renderList(); }
function refreshAll(){ renderProps(); renderList(); renderWarnings(); }
function duplicateSel(){
  if (selIdx<0) return;
  stopPlay(); pushUndo();
  const c = deepCopy(level.objects[selIdx]);
  c.x += 10; c.y -= 10;
  level.objects.splice(selIdx+1, 0, c);
  selIdx = selIdx+1;
  commit();
}
function deleteSel(){
  if (selIdx<0) return;
  stopPlay(); pushUndo();
  level.objects.splice(selIdx,1);
  selIdx = -1;
  commit();
}

/* ---------- mouse interaction ---------- */
function canvasScreenPos(e){
  const r = cv.getBoundingClientRect();
  return [(e.clientX-r.left)/2, (e.clientY-r.top)/2]; // 2× scale
}
const snapV = (v, fine)=> Math.round(v / (fine?1:5)) * (fine?1:5);
const snapA = (a, fine)=> { const s = fine?1:15; return ((Math.round(a/s)*s)%360+360)%360; };

cv.addEventListener("mousedown", e=>{
  if (testing) return;                 // test mode: canvas is the game screen
  const [sx,sy] = canvasScreenPos(e);
  if (playing) stopPlay();
  if (armedTool){
    const [cxx,cyy] = toCenter(sx,sy);
    pushUndo();
    const o = newObject(armedTool, snapV(cxx, e.shiftKey), snapV(cyy, e.shiftKey));
    level.objects.push(o);
    selIdx = level.objects.length-1;
    setArmed(null);
    commit();
    return;
  }
  const hit = hitTest(sx,sy);
  if (!hit){ selIdx = -1; refreshSel(); return; }
  selIdx = hit.idx;
  const o = level.objects[selIdx];
  if (hit.mode === "move"){
    drag = {mode:"move", idx:hit.idx, startSX:sx, startSY:sy, origX:o.x, origY:o.y, moved:false};
  } else if (hit.mode === "rotate"){
    drag = {mode:"rotate", idx:hit.idx, origAngle:o.angle||0, moved:false};
  } else if (hit.mode === "slideangle"){
    drag = {mode:"slideangle", idx:hit.idx, origAngle:o.slideAngle||0, moved:false};
  }
  refreshSel();
});
window.addEventListener("mousemove", e=>{
  const [sx,sy] = canvasScreenPos(e);
  const [ccx,ccy] = toCenter(sx,sy);
  if (sx>=0 && sx<=400 && sy>=0 && sy<=240)
    el("stCursor").textContent = `${Math.round(ccx)}, ${Math.round(ccy)}`;
  if (!drag) return;
  const o = level.objects[drag.idx];
  if (!o){ drag = null; return; }
  if (!drag.moved){ drag.moved = true; pushUndo(); }
  if (drag.mode === "move"){
    const dx = sx - drag.startSX, dy = sy - drag.startSY;
    o.x = snapV(drag.origX + dx, e.shiftKey);
    o.y = snapV(drag.origY - dy, e.shiftKey);   // screen dy → center-origin −dy
    renderList(); renderPropsSoft();
  } else if (drag.mode === "rotate"){
    const [cx,cy] = bodyCenterScreen(o, drag.idx);
    const a = Math.atan2(sy-cy, sx-cx)*180/Math.PI;
    o.angle = o.type === "launcher"
      ? snapA(launcherScreenAngle(a), e.shiftKey)
      : snapA(a, e.shiftKey);
    renderPropsSoft();
  } else if (drag.mode === "slideangle"){
    const [cx,cy] = toScreen(o.x,o.y);
    const a = Math.atan2(sy-cy, sx-cx)*180/Math.PI;
    o.slideAngle = snapA(a, e.shiftKey);
    renderPropsSoft();
  }
  renderWarnings();
});
window.addEventListener("mouseup", ()=>{
  if (drag && drag.moved) saveLocal();
  drag = null;
});
/* light-weight prop refresh during drags (rebuild only values) */
let propsSoftTimer = 0;
function renderPropsSoft(){
  const now = performance.now();
  if (now - propsSoftTimer < 80) return;
  propsSoftTimer = now;
  renderProps();
}

/* ---------- palette ---------- */
function setArmed(t){
  armedTool = t;
  document.querySelectorAll(".pal-btn").forEach(b=>{
    b.classList.toggle("armed", b.dataset.type === t);
  });
  cv.style.cursor = t ? "copy" : "crosshair";
  el("stMode").textContent = t ? `placing: ${t} — click the arena` : (playing?"PLAY":"");
}
document.querySelectorAll(".pal-btn").forEach(b=>{
  b.addEventListener("click", ()=>{
    stopPlay();
    setArmed(armedTool === b.dataset.type ? null : b.dataset.type);
  });
});

/* ---------- keyboard ---------- */
window.addEventListener("keydown", e=>{
  const tag = (e.target.tagName||"").toLowerCase();
  if (tag==="input" || tag==="textarea" || tag==="select") return;
  if (testing && testSim){
    if (e.key === "Shift"){ testKeys.add("Shift"); return; }
    switch(e.key){
      case "ArrowLeft": case "ArrowRight":
        e.preventDefault(); testKeys.add(e.key); return;
      case "a": case "d": case "A": case "D":
        e.preventDefault(); testKeys.add(e.key.toLowerCase()); return;
      case "ArrowUp": case " ":
        e.preventDefault();
        testKeys.add("ArrowUp");
        testSim.onAwayFromGravity(); return;
      case "ArrowDown": case "s": case "S":
        e.preventDefault();
        if (!testSim.game.levelComplete) testSim.tryDrop();
        return;
      case "Tab":
        e.preventDefault(); testSim.selectGroup(e.shiftKey ? "L" : "R"); return;
      case "q": case "Q":
        testSim.selectGroup("L"); return;
      case "e": case "E":
        testSim.selectGroup("R"); return;
      case "r": case "R":
        testSim.restartLevel(); return;
      case "Escape":
        stopTest(); return;
    }
    return;
  }
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase()==="z"){
    e.preventDefault();
    if (e.shiftKey) redo(); else undo();
    return;
  }
  if (mod && e.key.toLowerCase()==="d"){
    e.preventDefault(); duplicateSel(); return;
  }
  if (e.key==="Escape"){
    if (armedTool) setArmed(null);
    else { selIdx=-1; refreshSel(); }
    return;
  }
  if (e.key==="Delete" || e.key==="Backspace"){
    if (selIdx>=0){ e.preventDefault(); deleteSel(); }
    return;
  }
  const step = e.shiftKey ? 1 : 5;
  let dx=0, dy=0;
  if (e.key==="ArrowLeft") dx=-step;
  else if (e.key==="ArrowRight") dx=step;
  else if (e.key==="ArrowUp") dy=step;      // center-origin Y-up
  else if (e.key==="ArrowDown") dy=-step;
  else return;
  if (selIdx<0) return;
  e.preventDefault();
  stopPlay(); pushUndo();
  const o = level.objects[selIdx];
  o.x += dx; o.y += dy;
  commit();
});

/* ---------- level meta panel ---------- */
function syncLevelPanel(){
  el("lvName").value = level.name || "";
  el("lvTheme").value = level.theme || "";
  el("lvCeiling").value = level.ceiling || "solid";
  el("lvTutorial").value = level.tutorial || "";
  const spikes = resolveArenaSpikes(level.ceiling, level.spikedEdges);
  el("spTop").checked = !!spikes.top;
  el("spBottom").checked = !!spikes.bottom;
  el("spLeft").checked = !!spikes.left;
  el("spRight").checked = !!spikes.right;
  // Top checkbox is driven by ceiling=spikes; disable when open (no top wall).
  el("spTop").disabled = level.ceiling === "open";
}
function bindMeta(id, key){
  el(id).addEventListener("change", ()=>{
    pushUndo();
    level[key] = el(id).value;
    commit();
  });
}
bindMeta("lvName","name"); bindMeta("lvTheme","theme"); bindMeta("lvTutorial","tutorial");
el("lvCeiling").addEventListener("change", ()=>{
  pushUndo();
  level.ceiling = el("lvCeiling").value;
  // Keep spikedEdges in sync with ceiling legacy: spikes unions top; open clears top.
  const set = new Set(normalizeSpikedEdges(level.spikedEdges));
  if (level.ceiling === "spikes") set.add("top");
  else set.delete("top");
  if (level.ceiling === "open") set.delete("top");
  level.spikedEdges = [...set];
  syncLevelPanel();
  commit();
});
function bindSpikeEdge(id, edge){
  el(id).addEventListener("change", ()=>{
    if (edge === "top" && level.ceiling === "open"){ el(id).checked = false; return; }
    pushUndo();
    const set = new Set(normalizeSpikedEdges(level.spikedEdges));
    if (el(id).checked) set.add(edge); else set.delete(edge);
    level.spikedEdges = [...set];
    // Mirror top into ceiling for legacy parity when only top changes.
    if (edge === "top"){
      if (el(id).checked && level.ceiling !== "open") level.ceiling = "spikes";
      else if (!el(id).checked && level.ceiling === "spikes") level.ceiling = "solid";
      el("lvCeiling").value = level.ceiling;
    }
    syncLevelPanel();
    commit();
  });
}
bindSpikeEdge("spTop","top");
bindSpikeEdge("spBottom","bottom");
bindSpikeEdge("spLeft","left");
bindSpikeEdge("spRight","right");

/* ---------- top-bar buttons ---------- */
el("btnPlay").addEventListener("click", ()=>{
  if (testing) stopTest();
  playing ? stopPlay() : (setArmed(null), startPlay());
});
el("btnTest").addEventListener("click", ()=>{
  testing ? stopTest() : startTest();
});
el("btnNew").addEventListener("click", ()=>{
  if (!confirm("Start a new empty level? (current level stays in undo history)")) return;
  stopPlay(); pushUndo();
  level = {name:"Untitled", theme:"Roll", ceiling:"solid", tutorial:"", spikedEdges:[], objects:[
    newObject("spawn", -160, -100),
    newObject("exit", 180, -100),
  ]};
  selIdx = -1;
  syncLevelPanel(); commit();
});
el("btnIO").addEventListener("click", ()=>{
  el("ioDrawer").classList.toggle("open");
});
el("btnCloseIO").addEventListener("click", ()=> el("ioDrawer").classList.remove("open"));
el("btnExport").addEventListener("click", ()=>{
  el("ioText").value = exportLevel(level);
  ioMsg("Exported. Paste into levels.lua.", false);
});
el("btnCopy").addEventListener("click", async ()=>{
  const t = el("ioText");
  if (!t.value) t.value = exportLevel(level);
  try{
    await navigator.clipboard.writeText(t.value);
    ioMsg("Copied to clipboard.", false);
  }catch(err){
    t.select(); document.execCommand("copy");
    ioMsg("Copied (fallback).", false);
  }
});
el("btnImport").addEventListener("click", ()=>{
  try{
    const {level: lv, notes} = importLevelFromLua(el("ioText").value);
    stopPlay(); pushUndo();
    level = lv; selIdx = -1;
    syncLevelPanel(); commit();
    ioMsg("Imported \""+lv.name+"\" — "+lv.objects.length+" objects." + (notes.length? " "+notes.join(" ") : ""), false);
  }catch(err){
    ioMsg(err.message, true);
  }
});
function ioMsg(msg, isErr){
  const m = el("ioMsg");
  m.textContent = msg;
  m.className = isErr ? "err" : "ok";
}

/* ---------- built-in level loader ---------- */
(function(){
  const sel = el("lvLoad");
  for (const it of BUILTIN_LEVELS){
    const opt = document.createElement("option");
    opt.value = String(it.n);
    opt.textContent = `L${it.n} · ${it.name}` + (it.theme ? `  (${it.theme})` : "");
    sel.appendChild(opt);
  }
  sel.addEventListener("change", ()=>{
    const n = parseInt(sel.value, 10);
    sel.value = "";                       // re-arm so the same level can be re-picked
    if (!n) return;
    const it = BUILTIN_LEVELS.find(x=>x.n===n);
    if (!it) return;
    try{
      const {level: lv} = importLevelFromLua(it.lua);
      stopPlay(); setArmed(null); pushUndo();
      level = lv; selIdx = -1;
      syncLevelPanel(); commit();
      el("stMode").textContent = `loaded built-in L${n} "${lv.name}" — previous level is in undo history`;
    }catch(err){
      alert("Failed to load built-in level: " + err.message);
    }
  });
})();

/* overlay toggles redraw automatically via rAF; nothing to bind */

/* ---------- boot ---------- */
if (!loadLocal()){
  level = {name:"Untitled", theme:"Roll", ceiling:"solid", tutorial:"", spikedEdges:[], objects:[
    newObject("spawn", -160, -100),
    newObject("exit", 180, -100),
  ]};
}
syncLevelPanel();
refreshAll();
requestAnimationFrame(loop);

})();
</script>
