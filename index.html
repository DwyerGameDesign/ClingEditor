<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cling — Level Editor</title>
<style>
  :root{
    --ink:#111111;
    --paper:#ffffff;
    --chrome:#1c1c1a;
    --chrome-2:#26262a;
    --panel:#efede6;
    --panel-2:#e4e1d7;
    --line:#c9c5b8;
    --pd-yellow:#ffc500;   /* Playdate console yellow */
    --accent:#d88100;      /* editor-overlay orange (handles) */
    --err:#c62828;
    --warn:#a26a00;
    --ok:#2e7d32;
    --mono:"SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--panel); color:var(--ink);
    font-family:var(--mono); font-size:12px; line-height:1.45;
    display:flex; flex-direction:column; min-width:1180px;
  }
  /* ---------- top bar ---------- */
  header{
    background:var(--chrome); color:#eee; padding:8px 14px;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    border-bottom:4px solid var(--pd-yellow);
  }
  header .logo{
    font-weight:700; letter-spacing:.14em; font-size:14px; color:var(--pd-yellow);
    white-space:nowrap; user-select:none;
  }
  header .logo small{color:#bbb; letter-spacing:.06em; font-weight:400; margin-left:6px}
  header label{display:flex; align-items:center; gap:5px; color:#cfcfcf; white-space:nowrap}
  header input[type=text], header select{
    background:#111; color:#eee; border:1px solid #444; padding:3px 6px;
    font-family:var(--mono); font-size:12px;
  }
  header input[type=text]:focus, header select:focus{outline:1px solid var(--pd-yellow)}
  #lvName{width:150px} #lvTheme{width:110px} #lvTutorial{width:250px}
  header .spike-edges{gap:3px}
  header .edge-tgl{display:inline-flex; align-items:center; gap:2px; color:#cfcfcf}
  header .edge-tgl input{accent-color:var(--pd-yellow)}
  header .edge-tgl label{cursor:pointer; min-width:10px}
  .spacer{flex:1}
  button{
    font-family:var(--mono); font-size:12px; cursor:pointer;
    background:#333; color:#eee; border:1px solid #555; padding:4px 10px;
  }
  button:hover{border-color:var(--pd-yellow); color:var(--pd-yellow)}
  button.primary{background:var(--pd-yellow); color:#111; border-color:var(--pd-yellow); font-weight:700}
  button.primary:hover{background:#ffd84d; color:#111}
  button.active{background:var(--pd-yellow); color:#111; border-color:var(--pd-yellow)}
  /* ---------- main layout ---------- */
  main{flex:1; display:flex; min-height:0; overflow:hidden}
  /* palette */
  #palette{
    width:118px; background:var(--panel-2); border-right:1px solid var(--line);
    display:flex; flex-direction:column; gap:4px; padding:8px 6px; overflow-y:auto;
  }
  #palette h3, aside h3{
    margin:2px 0 4px; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:#666;
  }
  .pal-btn{
    background:var(--paper); color:var(--ink); border:1px solid var(--line);
    padding:5px 6px; text-align:left; font-size:11px; display:flex; align-items:center; gap:6px;
  }
  .pal-btn:hover{border-color:var(--ink); color:var(--ink)}
  .pal-btn.armed{background:var(--pd-yellow); border-color:#111; font-weight:700}
  .pal-btn .g{width:14px; text-align:center; font-weight:700}
  /* canvas column */
  #stage{flex:1; display:flex; flex-direction:column; align-items:center; overflow:auto; padding:12px}
  #canvasWrap{position:relative; border:3px solid var(--ink); background:var(--paper); box-shadow:6px 6px 0 rgba(0,0,0,.18)}
  canvas{display:block; image-rendering:pixelated; image-rendering:crisp-edges; cursor:crosshair}
  #toolbar{
    display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; justify-content:center;
  }
  #toolbar .tgl{display:flex; align-items:center; gap:4px; background:var(--paper); border:1px solid var(--line); padding:3px 7px; user-select:none; cursor:pointer}
  #toolbar .tgl input{margin:0}
  #status{
    margin-top:6px; color:#555; font-size:11px; display:flex; gap:18px; align-items:center; flex-wrap:wrap; justify-content:center;
  }
  #status b{color:#111}
  /* right side */
  aside{
    width:300px; background:var(--panel-2); border-left:1px solid var(--line);
    display:flex; flex-direction:column; min-height:0;
  }
  aside section{padding:8px 10px; border-bottom:1px solid var(--line); overflow-y:auto}
  #warnPanel{max-height:130px; flex:0 0 auto}
  #propsPanel{flex:0 0 auto; max-height:44%}
  #listPanel{flex:1 1 auto; min-height:80px}
  .warn-item{padding:3px 6px; margin:2px 0; border-left:3px solid var(--warn); background:#f6ecd6; color:#5c3d00}
  .warn-item.err{border-left-color:var(--err); background:#f7dcdc; color:#7a1010}
  .warn-item.ok{border-left-color:var(--ok); background:#e2efe2; color:#1d4b1f}
  /* properties */
  .prop-row{display:flex; align-items:center; gap:6px; margin:4px 0}
  .prop-row label{width:92px; color:#444; flex:0 0 auto}
  .prop-row input[type=number], .prop-row input[type=text]{
    width:70px; font-family:var(--mono); font-size:12px; padding:2px 4px;
    border:1px solid var(--line); background:var(--paper);
  }
  .prop-row input[type=range]{flex:1}
  .seg{display:flex}
  .seg button{padding:2px 8px; background:var(--paper); color:var(--ink); border:1px solid var(--line); border-left-width:0}
  .seg button:first-child{border-left-width:1px}
  .seg button.on{background:var(--ink); color:var(--pd-yellow); border-color:var(--ink)}
  .muted{color:#777}
  /* object list */
  #objList{list-style:none; margin:0; padding:0}
  #objList li{
    display:flex; align-items:center; gap:6px; padding:3px 6px; margin:2px 0;
    background:var(--paper); border:1px solid var(--line); cursor:pointer; user-select:none;
  }
  #objList li.sel{border-color:var(--ink); background:var(--pd-yellow)}
  #objList li.dragover{border-top:2px solid var(--accent)}
  #objList li .idx{color:#888; width:20px; text-align:right}
  #objList li .typ{font-weight:700; flex:0 0 auto}
  #objList li .pos{color:#666; margin-left:auto}
  /* IO drawer */
  #ioDrawer{
    background:var(--chrome-2); color:#ddd; border-top:4px solid var(--pd-yellow);
    padding:8px 14px; display:none; flex-direction:column; gap:6px;
  }
  #ioDrawer.open{display:flex}
  #ioDrawer textarea{
    width:100%; height:180px; background:#101010; color:#cfe8cf; border:1px solid #444;
    font-family:var(--mono); font-size:11.5px; padding:8px; white-space:pre; resize:vertical;
  }
  #ioDrawer .row{display:flex; gap:8px; align-items:center}
  #ioMsg{font-size:11px}
  #ioMsg.err{color:#ff8a8a} #ioMsg.ok{color:#9fe89f}
  kbd{background:#333; color:#ffd84d; border:1px solid #555; border-radius:2px; padding:0 4px; font-size:10px}
  .hint{color:#888; font-size:10.5px; margin-top:2px}
</style>
</head>
<body>

<header>
  <div class="logo">CLING<small>level editor</small></div>
  <label>name <input id="lvName" type="text" value="Untitled"></label>
  <label>theme <input id="lvTheme" type="text" list="themeList" value="Roll">
    <datalist id="themeList">
      <option>Roll</option><option>Clockwork</option><option>Pivot</option><option>Slide</option>
      <option>Launch</option><option>Remix</option><option>Machinery</option><option>Cling Works</option>
    </datalist>
  </label>
  <label>ceiling <select id="lvCeiling">
    <option value="solid">solid</option><option value="open">open</option><option value="spikes">spikes</option>
  </select></label>
  <label class="spike-edges" title="Per-edge spiked walls (spikedEdges). ceiling=spikes unions top; open clears top.">
    spikes
    <span class="edge-tgl"><input type="checkbox" id="spTop"><label for="spTop">T</label></span>
    <span class="edge-tgl"><input type="checkbox" id="spBottom"><label for="spBottom">B</label></span>
    <span class="edge-tgl"><input type="checkbox" id="spLeft"><label for="spLeft">L</label></span>
    <span class="edge-tgl"><input type="checkbox" id="spRight"><label for="spRight">R</label></span>
  </label>
  <label>tutorial <input id="lvTutorial" type="text" placeholder="(optional hint)"></label>
  <div class="spacer"></div>
  <label>load <select id="lvLoad"><option value="">— built-in level —</option></select></label>
  <button id="btnNew">New</button>
  <button id="btnIO">Import / Export</button>
  <button id="btnPlay">&#9654; Movers</button>
  <button id="btnTest" class="primary">&#127918; Test</button>
</header>

<main>
  <nav id="palette">
    <h3>Place</h3>
    <button class="pal-btn" data-type="spawn"><span class="g">&#9678;</span>spawn</button>
    <button class="pal-btn" data-type="exit"><span class="g">&#9633;</span>exit</button>
    <button class="pal-btn" data-type="coin"><span class="g">&#9675;</span>coin</button>
    <button class="pal-btn" data-type="hazard"><span class="g">&#10041;</span>hazard</button>
    <button class="pal-btn" data-type="wall"><span class="g">&#9473;</span>wall</button>
    <button class="pal-btn" data-type="breakable_wall"><span class="g">&#9636;</span>breakable</button>
    <button class="pal-btn" data-type="bounce_pad"><span class="g">&#8613;</span>bounce pad</button>
    <button class="pal-btn" data-type="bouncer"><span class="g">&#9679;</span>bouncer</button>
    <button class="pal-btn" data-type="deflector"><span class="g">&#9639;</span>deflector</button>
    <button class="pal-btn" data-type="sweeper"><span class="g">&#10530;</span>sweeper</button>
    <button class="pal-btn" data-type="toggle_wall"><span class="g">&#8635;</span>toggle wall</button>
    <button class="pal-btn" data-type="sliding_wall"><span class="g">&#8703;</span>sliding wall</button>
    <button class="pal-btn" data-type="moving_wall"><span class="g">&#8644;</span>moving wall</button>
    <button class="pal-btn" data-type="moving_hazard"><span class="g">&#10042;</span>moving hazard</button>
    <button class="pal-btn" data-type="launcher"><span class="g">&#10148;</span>launcher</button>
    <div class="hint" style="margin-top:8px">Click a tool, then click the arena. <br><br><kbd>Esc</kbd> cancel / deselect<br><kbd>&#8679;</kbd> fine snap<br><kbd>&#8963;/&#8984;Z</kbd> undo<br><kbd>&#8963;/&#8984;&#8679;Z</kbd> redo<br><kbd>&#8963;/&#8984;D</kbd> duplicate<br><kbd>&#9003;</kbd> delete<br>arrows nudge 5 (&#8679;=1)</div>
  </nav>

  <div id="stage">
    <div id="toolbar">
      <span class="tgl"><input type="checkbox" id="ovGrid"><label for="ovGrid">grid</label></span>
      <span class="tgl"><input type="checkbox" id="ovKill" checked><label for="ovKill">kill radii</label></span>
      <span class="tgl"><input type="checkbox" id="ovReach" checked><label for="ovReach">deflector reach</label></span>
      <span class="tgl"><input type="checkbox" id="ovSnap"><label for="ovSnap">snap zones</label></span>
    </div>
    <div id="canvasWrap"><canvas id="cv" width="800" height="480"></canvas></div>
    <div id="status">
      <span>cursor <b id="stCursor">—</b></span>
      <span id="stSel" class="muted">nothing selected</span>
      <span id="stMode" class="muted"></span>
    </div>
  </div>

  <aside>
    <section id="warnPanel"><h3>Checks</h3><div id="warnList"></div></section>
    <section id="propsPanel"><h3>Properties</h3><div id="props"><div class="muted">Select an object.</div></div></section>
    <section id="listPanel"><h3>Objects <span class="muted" id="objCount"></span></h3><ul id="objList"></ul></section>
  </aside>
</main>

<div id="ioDrawer">
  <div class="row">
    <button id="btnExport" class="primary">Export Lua</button>
    <button id="btnCopy">Copy</button>
    <button id="btnImport">Import from text</button>
    <span id="ioMsg"></span>
    <div class="spacer"></div>
    <button id="btnCloseIO">&#10005;</button>
  </div>
  <textarea id="ioText" spellcheck="false" placeholder='Paste a single level entry here, e.g. { name = "My Level", theme = "Roll", ceiling = "solid", objects = { ... } },'></textarea>
</div>

<script>
"use strict";
/* =====================================================================
   Cling Level Editor — single file.
   Data model is CENTER-ORIGIN, Y-UP (like levels.lua).
   All geometry & rendering happen in SCREEN SPACE (Y-down), exactly like
   the game; angles are stored/exported verbatim in screen convention.
   ===================================================================== */

/* ---------------- constants (config.lua) ---------------- */
const CFG = {
  SCREEN_W:400, SCREEN_H:240, FPS:30,
  WALL_LINE_WIDTH:5,
  ARENA_INSET:20,
  BAR_WIDTH:16,
  WALL_WIDTH:12,
  JUNCTION_SNAP:16,
  WALL_SIZES:{S:50,M:70,L:100},
  DEFLECTOR_SIZES:{S:55,M:75,L:100},
  SLIDER_SPANS:{S:42,M:60,L:90},
  SWEEPER_SPEEDS:{S:0.8,M:1.0,F:1.3},
  TOGGLE_INTERVALS:{S:210,M:150,F:105},
  MOVING_SPEEDS:{S:0.005,M:0.008,F:0.012},
  HAZARD_RADIUS_DEFAULT:14,
  LAUNCHER_MOUTH_DIST:18,
  BOUNCER_RADIUS:12,
  BOUNCER_RESTITUTION:1,
  SPIKE_HAZARD_R:9,
  SPIKE_HAZARD_GAP:2,
};
const ARENA = {L:-180, R:180, B:-100, T:100}; // center-origin extents
const ARENA_EDGE_NAMES = ["top","right","bottom","left"];

/* coords.lua: toScreen / toCenter */
function toScreen(x,y){ return [x+200, 120-y]; }
function toCenter(sx,sy){ return [sx-200, 120-sy]; }
const rad = d => d*Math.PI/180;

const BAR_TYPES = new Set(["wall","breakable_wall","bounce_pad","deflector","sweeper","toggle_wall","sliding_wall","moving_wall"]);
const SLIDE_TYPES = new Set(["sliding_wall","moving_wall","moving_hazard"]);
const CRANKABLE = new Set(["deflector","sliding_wall","launcher"]);
const ANGLED = new Set(["wall","breakable_wall","bounce_pad","deflector","sweeper","toggle_wall","sliding_wall","moving_wall","launcher"]);

function resolveArenaSpikes(ceiling, spikedEdges){
  const spikes = { top:false, bottom:false, left:false, right:false };
  if (ceiling === "spikes") spikes.top = true;
  if (Array.isArray(spikedEdges)){
    for (const name of spikedEdges){
      if (spikes[name] !== undefined) spikes[name] = true;
    }
  }
  if (ceiling === "open") spikes.top = false;
  return spikes;
}
function spikedEdgesList(spikes){
  return ARENA_EDGE_NAMES.filter(e => spikes[e]);
}
function normalizeSpikedEdges(list){
  const out = [];
  const seen = new Set();
  if (!Array.isArray(list)) return out;
  for (const name of list){
    if ((name === "top" || name === "bottom" || name === "left" || name === "right") && !seen.has(name)){
      seen.add(name); out.push(name);
    }
  }
  return out;
}

/* ---------------- object defaults ---------------- */
function newObject(type, x, y){
  const o = {type, x, y};
  switch(type){
    case "hazard": o.radius = CFG.HAZARD_RADIUS_DEFAULT; break;
    case "wall": case "breakable_wall": case "bounce_pad":
      o.length = CFG.WALL_SIZES.M; o.angle = 0;
      if (type === "breakable_wall") o.hp = 1;
      break;
    case "bouncer":
      o.radius = CFG.BOUNCER_RADIUS; o.restitution = CFG.BOUNCER_RESTITUTION; break;
    case "deflector": o.length = CFG.DEFLECTOR_SIZES.M; o.angle = 0; break;
    case "sweeper":
      o.length = CFG.WALL_SIZES.M; o.angle = 0; o.minAngle = 0; o.maxAngle = 90; o.speed = "M"; break;
    case "toggle_wall":
      o.length = CFG.WALL_SIZES.M; o.angle = 0; o.angleStep = 45; o.speed = "M"; break;
    case "sliding_wall":
      o.length = CFG.WALL_SIZES.M; o.angle = 0; o.slideAngle = 0; o.slideRange = "M"; o.objectPosition = 0.5; break;
    case "moving_wall":
      o.length = CFG.WALL_SIZES.M; o.angle = 0; o.slideAngle = 0; o.slideRange = "M"; o.objectPosition = 0.5; o.speed = "M"; break;
    case "moving_hazard":
      o.radius = CFG.HAZARD_RADIUS_DEFAULT; o.slideAngle = 0; o.slideRange = "M"; o.objectPosition = 0.5; o.speed = "M"; break;
    case "launcher": o.angle = 0; break;
  }
  return o;
}

/* slide-rail semantics (applySlideRailConfig): span sp per letter,
   rail from anchor−sp to anchor+sp along slideAngle (screen space),
   pix = −sp + objectPosition·2sp. */
function slideSpan(o){ return CFG.SLIDER_SPANS[o.slideRange] || CFG.SLIDER_SPANS.M; }
function slidePix(o, pos){
  const sp = slideSpan(o);
  return -sp + (pos===undefined? o.objectPosition : pos)*2*sp;
}
/* body center in SCREEN space at given objectPosition */
function slideBodyScreen(o, pos){
  const [sx,sy] = toScreen(o.x, o.y);
  const r = rad(o.slideAngle||0), pix = slidePix(o,pos);
  return [sx+Math.cos(r)*pix, sy+Math.sin(r)*pix];
}
function barEndpointsScreen(cx,cy,len,angleDeg){
  const a = rad(angleDeg), h = len/2, c = Math.cos(a), s = Math.sin(a);
  return [cx-c*h, cy-s*h, cx+c*h, cy+s*h];
}
function nearestSpeedLetter(v, table){
  let best="M", bd=Infinity;
  for(const k of ["S","M","F"]){ const d=Math.abs(v-table[k]); if(d<bd){bd=d;best=k;} }
  return best;
}
function nearestSpanLetter(span){
  let best="M", bd=Infinity;
  for(const k of ["S","M","L"]){ const d=Math.abs(span-CFG.SLIDER_SPANS[k]); if(d<bd){bd=d;best=k;} }
  return best;
}

/* =====================================================================
   Lua export (house style of levels.lua)
   ===================================================================== */
function fmtNum(n){
  if (typeof n !== "number" || !isFinite(n)) return String(n);
  if (Number.isInteger(n)) return String(n);
  let s = n.toFixed(4).replace(/0+$/,"").replace(/\.$/,"");
  return s;
}
function fmtPos01(n){ // objectPosition: always show a decimal (0.0, 0.3, 1.0)
  const s = fmtNum(n);
  return s.includes(".") ? s : s + ".0";
}
function luaStr(s){ return '"' + String(s).replace(/\\/g,"\\\\").replace(/"/g,'\\"') + '"'; }

/* which params go on line 1 vs the continuation line */
const EXPORT_SPEC = {
  spawn:        {l1:["x","y"], l2:[]},
  exit:         {l1:["x","y"], l2:[]},
  coin:         {l1:["x","y"], l2:[]},
  hazard:       {l1:["x","y","radius"], l2:[]},
  wall:         {l1:["x","y","length","angle"], l2:[]},
  breakable_wall:{l1:["x","y","length","angle"], l2:["hp"]},
  bounce_pad:   {l1:["x","y","length","angle"], l2:[]},
  bouncer:      {l1:["x","y","radius"], l2:["restitution"]},
  deflector:    {l1:["x","y","length","angle"], l2:[]},
  launcher:     {l1:["x","y","angle"], l2:[]},
  sweeper:      {l1:["x","y","length","angle"], l2:["minAngle","maxAngle","speed"]},
  toggle_wall:  {l1:["x","y","length","angle"], l2:["angleStep","speed"]},
  sliding_wall: {l1:["x","y","length","angle"], l2:["slideAngle","slideRange","objectPosition"]},
  moving_wall:  {l1:["x","y","length","angle"], l2:["slideAngle","slideRange","objectPosition","speed"]},
  moving_hazard:{l1:["x","y","radius"], l2:["slideAngle","slideRange","objectPosition","speed"]},
};
function fmtParam(key, val){
  if (key === "objectPosition") return key + " = " + fmtPos01(val);
  if (typeof val === "string") return key + " = " + luaStr(val);
  if (typeof val === "boolean") return key + " = " + (val ? "true" : "false");
  return key + " = " + fmtNum(val);
}

function exportLevel(level){
  const objs = level.objects;
  const specs = objs.map(o => EXPORT_SPEC[o.type] || {l1:["x","y"],l2:[]});
  const typeF = objs.map(o => luaStr(o.type) + ",");
  const typeW = Math.max(0, ...typeF.map(s=>s.length));
  const xVals = objs.map(o => fmtNum(o.x));
  const xW = Math.max(0, ...xVals.map(s=>s.length));
  const yVals = objs.map(o => fmtNum(o.y));
  const yW = Math.max(0, ...yVals.map(s=>s.length));

  const lines = [];
  let head = `  { name = ${luaStr(level.name||"Untitled")}, theme = ${luaStr(level.theme||"Roll")}, ceiling = ${luaStr(level.ceiling||"solid")},`;
  const edges = normalizeSpikedEdges(level.spikedEdges);
  const hasTutorial = level.tutorial && String(level.tutorial).trim() !== "";
  if (edges.length || hasTutorial){
    lines.push(head);
    if (edges.length){
      lines.push(`    spikedEdges = { ${edges.map(e => luaStr(e)).join(", ")} },`);
    }
    if (hasTutorial){
      lines.push(`    tutorial = ${luaStr(level.tutorial)}, objects = {`);
    } else {
      lines.push(`    objects = {`);
    }
  } else {
    lines.push(head + " objects = {");
  }

  objs.forEach((o,i)=>{
    const spec = specs[i];
    const extras = o._extra ? Object.keys(o._extra) : [];
    const l2keys = spec.l2.filter(k => o[k] !== undefined);
    const hasL2 = l2keys.length > 0 || (extras.length > 0 && spec.l2.length > 0);

    let line = "    { type = " + typeF[i].padEnd(typeW) + " ";
    const parts = [];
    for (const k of spec.l1){
      if (o[k] === undefined) continue;
      if (k === "x"){
        parts.push("x = " + (xVals[i]+",").padEnd(xW+1));
      } else if (k === "y"){
        const more = spec.l1.indexOf("y") < spec.l1.length-1 || hasL2 || extras.length>0;
        parts.push("y = " + (more ? (yVals[i]+",").padEnd(yW+1) : yVals[i]+","));
      } else {
        parts.push(fmtParam(k,o[k]) + ",");
      }
    }
    // extras go at the end of whichever line is last
    const extraParts = extras.map(k => fmtParam(k, o._extra[k]) + ",");
    if (!hasL2){
      for (const ep of extraParts) parts.push(ep);
      line += parts.join(" ");
      line = line.replace(/,\s*$/,"") + " },";
      lines.push(line);
    } else {
      line += parts.join(" ");
      lines.push(line.replace(/\s+$/,""));
      let cont = "      " + l2keys.map(k=>fmtParam(k,o[k]) + ",").concat(extraParts).join(" ");
      cont = cont.replace(/,\s*$/,"") + " },";
      lines.push(cont);
    }
  });
  lines.push("  }},");
  return lines.join("\n");
}

/* =====================================================================
   Lua import — tolerant tokenizer/parser for the restricted table subset
   ===================================================================== */
function parseLuaText(src){
  let i = 0;
  const n = src.length;
  function err(msg){ throw new Error("Parse error at char "+i+": "+msg); }
  function skip(){
    for(;;){
      while (i<n && /\s/.test(src[i])) i++;
      if (src[i]==="-" && src[i+1]==="-"){ while(i<n && src[i]!=="\n") i++; continue; }
      break;
    }
  }
  function parseString(){
    const q = src[i]; i++;
    let out = "";
    while(i<n){
      const c = src[i];
      if (c === "\\"){ 
        const nx = src[i+1];
        if (nx === "n") out += "\n";
        else if (nx === "t") out += "\t";
        else out += nx;
        i += 2; continue;
      }
      if (c === q){ i++; return out; }
      out += c; i++;
    }
    err("unterminated string");
  }
  function parseNumber(){
    const m = /^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?/.exec(src.slice(i));
    if (!m) err("bad number");
    i += m[0].length;
    return parseFloat(m[0]);
  }
  function takeIdent(){
    const m = /^[A-Za-z_][A-Za-z0-9_]*/.exec(src.slice(i));
    if (!m) return null;
    i += m[0].length;
    return m[0];
  }
  function takeValue(){
    skip();
    const c = src[i];
    if (c === "{") return parseTable();
    if (c === '"' || c === "'") return parseString();
    if (c === "-" || c === "+" || /[0-9.]/.test(c)) return parseNumber();
    const id = takeIdent();
    if (id === "true") return true;
    if (id === "false") return false;
    if (id === "nil") return null;
    if (id) err("unexpected identifier '"+id+"'");
    err("unexpected character '"+c+"'");
  }
  function parseTable(){
    skip();
    if (src[i] !== "{") err("expected '{'");
    i++;
    const map = {}, arr = [];
    for(;;){
      skip();
      if (i>=n) err("unterminated table");
      if (src[i] === "}"){ i++; break; }
      // key = value ?
      const save = i;
      const id = takeIdent();
      if (id){
        skip();
        if (src[i] === "="){
          i++;
          map[id] = takeValue();
        } else {
          // bare identifier value (true/false/nil) as array item
          i = save;
          arr.push(takeValue());
        }
      } else if (src[i] === "["){
        // [key] = value — accept numeric/string bracket keys
        i++;
        const k = takeValue();
        skip();
        if (src[i] !== "]") err("expected ']'");
        i++; skip();
        if (src[i] !== "=") err("expected '='");
        i++;
        map[String(k)] = takeValue();
      } else {
        arr.push(takeValue());
      }
      skip();
      if (src[i] === "," || src[i] === ";"){ i++; continue; }
      skip();
      if (src[i] === "}"){ i++; break; }
      err("expected ',' or '}'");
    }
    return {__table:true, map, arr};
  }
  // find first '{'
  skip();
  while (i<n && src[i] !== "{"){
    if (src[i]==="-" && src[i+1]==="-"){ while(i<n && src[i]!=="\n") i++; }
    else i++;
    skip();
  }
  if (i>=n) throw new Error("No Lua table found in the pasted text.");
  return parseTable();
}

const NUMERIC_KEYS = new Set(["x","y","length","angle","radius","minAngle","maxAngle","angleStep","slideAngle","objectPosition","slidePosition","minSlide","maxSlide","slideOffset","maxOpen","hp","restitution"]);
const KNOWN_KEYS = {
  spawn:["x","y"], exit:["x","y"], coin:["x","y"],
  hazard:["x","y","radius"],
  wall:["x","y","length","angle"],
  breakable_wall:["x","y","length","angle","hp"],
  bounce_pad:["x","y","length","angle"],
  bouncer:["x","y","radius","restitution"],
  deflector:["x","y","length","angle"],
  launcher:["x","y","angle"],
  sweeper:["x","y","length","angle","minAngle","maxAngle","speed"],
  toggle_wall:["x","y","length","angle","angleStep","speed"],
  sliding_wall:["x","y","length","angle","slideAngle","slideRange","objectPosition"],
  moving_wall:["x","y","length","angle","slideAngle","slideRange","objectPosition","speed"],
  moving_hazard:["x","y","radius","slideAngle","slideRange","objectPosition","speed"],
};

function importLevelFromLua(text){
  const t = parseLuaText(text);
  let lt = t;
  const notes = [];
  if (!lt.map.objects){
    // maybe the whole levels list was pasted — take the first level entry
    const cand = lt.arr.find(v => v && v.__table && v.map.objects);
    if (cand){ lt = cand; notes.push("Pasted text contained multiple levels — imported the first one."); }
    else throw new Error("Table has no 'objects' field — paste a single level entry.");
  }
  const level = {
    name: typeof lt.map.name === "string" ? lt.map.name : "Untitled",
    theme: typeof lt.map.theme === "string" ? lt.map.theme : "Roll",
    ceiling: (lt.map.ceiling === "open" || lt.map.ceiling === "spikes") ? lt.map.ceiling : "solid",
    tutorial: typeof lt.map.tutorial === "string" ? lt.map.tutorial : "",
    spikedEdges: [],
    objects: [],
  };
  if (lt.map.spikedEdges && lt.map.spikedEdges.__table){
    level.spikedEdges = normalizeSpikedEdges(
      lt.map.spikedEdges.arr.filter(v => typeof v === "string")
    );
  }
  const objsT = lt.map.objects;
  if (!objsT || !objsT.__table) throw new Error("'objects' is not a table.");
  for (const item of objsT.arr){
    if (!item || !item.__table){ notes.push("Skipped a non-table entry in objects."); continue; }
    const m = item.map;
    const type = m.type;
    if (typeof type !== "string" || !EXPORT_SPEC[type]){
      notes.push("Skipped unsupported object type: " + JSON.stringify(type));
      continue;
    }
    const o = {type};
    const known = new Set(KNOWN_KEYS[type]);
    for (const [k,v] of Object.entries(m)){
      if (k === "type") continue;
      let val = v;
      if (val && val.__table){ notes.push("Dropped nested table param '"+k+"' on "+type+"."); continue; }
      if (NUMERIC_KEYS.has(k) && typeof val === "string") val = parseFloat(val);
      if (known.has(k)) o[k] = val;
      else { (o._extra = o._extra || {})[k] = val; }
    }
    // legacy conversions (mirrors applySlideRailConfig / resolveMotionSpeed)
    if (SLIDE_TYPES.has(type)){
      if (o.slideRange === undefined){
        const ex = o._extra || {};
        if (ex.minSlide !== undefined || ex.maxSlide !== undefined){
          const mn = ex.minSlide !== undefined ? ex.minSlide : -CFG.SLIDER_SPANS.M;
          const mx = ex.maxSlide !== undefined ? ex.maxSlide : CFG.SLIDER_SPANS.M;
          o.slideRange = nearestSpanLetter(Math.max(Math.abs(mn),Math.abs(mx)));
          delete ex.minSlide; delete ex.maxSlide;
          notes.push(type+": converted legacy minSlide/maxSlide to slideRange \""+o.slideRange+"\".");
        } else o.slideRange = "M";
      }
      if (o.objectPosition === undefined){
        const ex = o._extra || {};
        if (ex.slidePosition !== undefined){ o.objectPosition = ex.slidePosition; delete ex.slidePosition; }
        else o.objectPosition = 0.5;
      }
      o.objectPosition = Math.max(0, Math.min(1, o.objectPosition));
      if (o.slideAngle === undefined) o.slideAngle = 0;
    }
    if ("speed" in o && typeof o.speed === "number"){
      const tbl = (type === "sweeper") ? CFG.SWEEPER_SPEEDS
                : (type === "toggle_wall") ? CFG.TOGGLE_INTERVALS
                : CFG.MOVING_SPEEDS;
      o.speed = nearestSpeedLetter(o.speed, tbl);
      notes.push(type+": numeric speed snapped to \""+o.speed+"\".");
    }
    if (o._extra && Object.keys(o._extra).length === 0) delete o._extra;
    // fill required defaults (same as game constructors)
    const d = newObject(type, o.x ?? 0, o.y ?? 0);
    for (const [k,v] of Object.entries(d)) if (o[k] === undefined) o[k] = v;
    level.objects.push(o);
  }
  return {level, notes};
}

/* =====================================================================
   GAMEPLAY SIMULATION — faithful port of rails.lua + cling_ball.lua +
   the game glue in main.lua. Screen space (Y-down). Rails arrays are
   1-BASED (index 0 = null) to preserve the Lua code's index semantics.
   ===================================================================== */
const SIM = {
  BALL_RADIUS:5, BALL_CRANK_SENS:0.55, BAR_CRANK_SENS:0.45, BAR_RIDER_SCALE:0.6,
  BAR_WIDTH:16, WALL_WIDTH:12, JUNCTION_SNAP:16.0, JUNCTION_EPSILON:6.0,
  COIN_PICKUP:9.0, EXIT_PICKUP:12, COIN_BONUS:500,
  LAUNCH_SPEED:6.5, MOUTH_DIST:18, LAUNCHER_BOARD_SNAP:28.0, LAUNCH_CATCH_SNAP:14.0,
  LAUNCH_GRACE:8, LAUNCHER_CRANK_SENS:0.5, SLIDER_CRANK_SENS:0.6,
  DROP_SPEED:5, DROP_FACE_NY:-0.3, DROP_ORIGIN_EPS:2, DROP_BAND_SLACK:3,
  ARENA_INSET:20,
  GRAVITY:0.6, FALL_TERMINAL:8.0, FALL_START_VY:0.0, MAX_SUBSTEP:6.0,
  BOUNCE_PAD_MIN_IMPACT:3.5, BOUNCE_PAD_GAIN:1.15, BOUNCE_PAD_MAX_SPEED:11.0,
  BOUNCER_RADIUS:12.0, BOUNCER_RESTITUTION:1.0,
  BREAK_BY_FALL_IMPACT:7.0,
};
const mod = (a,n)=>{ const r = a % n; return r < 0 ? r + n : r; };

/* ---------------- rails.lua ---------------- */
const RL = {
  segments(rail){
    const pts = rail.pts, n = pts.length, segs = [];
    if (n < 2) return segs;
    const count = rail.closed ? n : n-1;
    for (let i=0;i<count;i++){
      const a = pts[i], b = pts[(i+1)%n];
      segs.push({a,b,len:Math.hypot(b.x-a.x,b.y-a.y)});
    }
    return segs;
  },
  length(rail){
    let t=0; for (const s of RL.segments(rail)) t+=s.len; return t;
  },
  boardingPoints(rail){
    if (rail.boardAt) return rail.boardAt;
    if (rail.closed) return null;
    return [0, RL.length(rail)];
  },
  pointAt(rail, s){
    const segs = RL.segments(rail);
    let total=0; for (const sg of segs) total+=sg.len;
    if (total<=0){ const p=rail.pts[0]; return [p.x,p.y]; }
    if (rail.closed) s = mod(s,total);
    else { if (s<0) s=0; if (s>total) s=total; }
    let rem = s;
    for (let i=0;i<segs.length;i++){
      const seg = segs[i];
      if (rem <= seg.len || i === segs.length-1){
        let t = seg.len>0 ? rem/seg.len : 0;
        if (t>1) t=1; if (t<0) t=0;
        return [seg.a.x + (seg.b.x-seg.a.x)*t, seg.a.y + (seg.b.y-seg.a.y)*t];
      }
      rem -= seg.len;
    }
    const last = rail.pts[rail.pts.length-1];
    return [last.x,last.y];
  },
  tangentAt(rail, s){
    const segs = RL.segments(rail);
    let total=0; for (const sg of segs) total+=sg.len;
    if (total<=0) return [1,0];
    let q = s;
    if (rail.closed) q = mod(q,total);
    else { if (q<0) q=0; if (q>total) q=total; }
    let rem = q;
    for (let i=0;i<segs.length;i++){
      const seg = segs[i];
      if (rem < seg.len || i === segs.length-1){
        if (seg.len <= 1e-6) return [1,0];
        return [(seg.b.x-seg.a.x)/seg.len, (seg.b.y-seg.a.y)/seg.len];
      }
      rem -= seg.len;
    }
    return [1,0];
  },
  closestPoint(rail, px, py){
    const segs = RL.segments(rail);
    let bestDist = Infinity, bestS = 0, accum = 0;
    for (const seg of segs){
      const ax=seg.a.x, ay=seg.a.y, bx=seg.b.x, by=seg.b.y;
      const abx=bx-ax, aby=by-ay, apx=px-ax, apy=py-ay;
      const ab2 = abx*abx+aby*aby;
      let t = 0;
      if (ab2 > 1e-12){
        t = (apx*abx+apy*aby)/ab2;
        if (t<0) t=0; else if (t>1) t=1;
      }
      const qx=ax+abx*t, qy=ay+aby*t;
      const d = Math.hypot(px-qx,py-qy);
      if (d < bestDist){ bestDist = d; bestS = accum + t*seg.len; }
      accum += seg.len;
    }
    return {d:bestDist, s:bestS};
  },
  fallHitOnSegment(ax,ay,bx,by,accum,cx,halfW,minY){
    const xLo=cx-halfW, xHi=cx+halfW;
    const dx=bx-ax, dy=by-ay;
    const len = Math.hypot(dx,dy);
    if (len < 1e-9){
      if (ax>=xLo && ax<=xHi && ay>=minY) return {hitY:ay, s:accum};
      return null;
    }
    let tMin=0, tMax=1;
    if (Math.abs(dx) < 1e-9){
      if (ax<xLo || ax>xHi) return null;
    } else {
      let tA=(xLo-ax)/dx, tB=(xHi-ax)/dx;
      if (tA>tB){ const tmp=tA; tA=tB; tB=tmp; }
      tMin = Math.max(0,tA); tMax = Math.min(1,tB);
      if (tMin>tMax) return null;
    }
    const yAtTMin = ay+tMin*dy, yAtTMax = ay+tMax*dy;
    const loY = Math.min(yAtTMin,yAtTMax), hiY = Math.max(yAtTMin,yAtTMax);
    if (hiY < minY) return null;
    let hitY = Math.max(loY,minY), hitT;
    if (Math.abs(dy) < 1e-9) hitT = tMin;
    else {
      hitT = (hitY-ay)/dy;
      if (hitT<tMin) hitT=tMin;
      if (hitT>tMax) hitT=tMax;
      hitY = ay + hitT*dy;
    }
    return {hitY, s:accum + hitT*len};
  },
};

/* ---------------- rail builders (main.lua) ---------------- */
function makeOpenRailS(x,y,length,angleDeg){
  const [x1,y1,x2,y2] = barEndpointsScreen(x,y,length,angleDeg);
  return {closed:false, pts:[{x:x1,y:y1},{x:x2,y:y2}]};
}
function makeBarOutlineRailS(x,y,length,angleDeg,width){
  const w = width ?? SIM.WALL_WIDTH;
  const a = rad(angleDeg);
  const ux=Math.cos(a), uy=Math.sin(a), px=-uy, py=ux;
  const hL=length/2, hW=w/2;
  const pt = (along,perp)=>({x:x+ux*along+px*perp, y:y+uy*along+py*perp});
  return {
    closed:true,
    pts:[pt(-hL,-hW), pt(hL,-hW), pt(hL,hW), pt(-hL,hW)],
    kind:"bar_outline", halfWidth:hW, barLength:length,
    cx:x, cy:y, ux, uy, px, py,
  };
}
function arenaRailS(mode){
  const inset = SIM.ARENA_INSET;
  const L=inset, R=CFG.SCREEN_W-inset, T=inset, B=CFG.SCREEN_H-inset;
  if (mode === "open"){
    return {closed:false, pts:[{x:L,y:T},{x:L,y:B},{x:R,y:B},{x:R,y:T}]};
  }
  return {closed:true, pts:[{x:L,y:T},{x:R,y:T},{x:R,y:B},{x:L,y:B}]};
}

/* ---------------- sim objects (screen-space; authored objects untouched) --- */
function makeSimObjects(level){
  const out = [];
  for (const a of level.objects){
    const [sx,sy] = toScreen(a.x, a.y);
    const o = {type:a.type, x:sx, y:sy};
    switch(a.type){
      case "hazard": o.radius = a.radius ?? CFG.HAZARD_RADIUS_DEFAULT; break;
      case "coin": o.collected = false; break;
      case "wall": case "deflector": case "bounce_pad": case "breakable_wall":
        o.length = a.length; o.angle = a.angle||0;
        if (a.type === "breakable_wall"){ o.hp = a.hp ?? 1; o.broken = false; }
        break;
      case "bouncer":
        o.radius = a.radius ?? CFG.BOUNCER_RADIUS;
        o.restitution = a.restitution ?? CFG.BOUNCER_RESTITUTION;
        break;
      case "sweeper":
        o.length = a.length; o.angle = a.angle||0;
        o.minAngle = a.minAngle ?? 0; o.maxAngle = a.maxAngle ?? 90;
        o.speed = CFG.SWEEPER_SPEEDS[a.speed] ?? CFG.SWEEPER_SPEEDS.M;
        o._sweepDir = 1; break;
      case "toggle_wall":
        o.length = a.length; o.baseAngle = a.angle||0;
        o.angle = mod(o.baseAngle, 360);
        o.angleStep = a.angleStep ?? 45;
        o.intervalFrames = CFG.TOGGLE_INTERVALS[a.speed] ?? CFG.TOGGLE_INTERVALS.M;
        o._timer = 0; o._k = 0; break;
      case "sliding_wall": case "moving_wall": case "moving_hazard": {
        if (a.type !== "moving_hazard"){ o.length = a.length; o.angle = a.angle||0; }
        else o.radius = a.radius ?? CFG.HAZARD_RADIUS_DEFAULT;
        o.slideAngle = a.slideAngle||0;
        const sp = CFG.SLIDER_SPANS[a.slideRange] ?? CFG.SLIDER_SPANS.M;
        o.minSlide = -sp; o.maxSlide = sp;
        o.objectPosition = Math.max(0, Math.min(1, a.objectPosition ?? 0.5));
        if (a.type !== "sliding_wall"){
          o.speed = CFG.MOVING_SPEEDS[a.speed] ?? CFG.MOVING_SPEEDS.M;
          o._moveDir = (o.objectPosition >= 1-0.001) ? -1 : 1;
        }
        break;
      }
      case "launcher": o.angle = a.angle||0; break;
    }
    out.push(o);
  }
  return out;
}
function simSlideCenter(o){
  const span = o.maxSlide - o.minSlide;
  const pix = span <= 0 ? o.minSlide : o.minSlide + o.objectPosition*span;
  const r = rad(o.slideAngle);
  return [o.x + Math.cos(r)*pix, o.y + Math.sin(r)*pix];
}
function simGetRail(o){
  if (o.broken) return null;
  switch(o.type){
    case "wall": case "toggle_wall": case "breakable_wall":
      return makeBarOutlineRailS(o.x, o.y, o.length, o.angle, SIM.WALL_WIDTH);
    case "deflector": case "sweeper": case "bounce_pad":
      return makeOpenRailS(o.x, o.y, o.length, o.angle);
    case "sliding_wall": {
      const [cx,cy] = simSlideCenter(o);
      return makeBarOutlineRailS(cx, cy, o.length, o.angle, SIM.BAR_WIDTH);
    }
    case "moving_wall": {
      const [cx,cy] = simSlideCenter(o);
      return makeBarOutlineRailS(cx, cy, o.length, o.angle, SIM.WALL_WIDTH);
    }
  }
  return null;
}
function simGetMouthPos(o){
  const a = rad(o.angle||0);
  return [o.x + Math.cos(a)*SIM.MOUTH_DIST, o.y + Math.sin(a)*SIM.MOUTH_DIST];
}

/* ---------------- createClingSim ---------------- */
function createClingSim(level){
  let ceiling = level.ceiling;
  if (ceiling !== "open" && ceiling !== "spikes") ceiling = "solid";
  const arenaSpikes = resolveArenaSpikes(ceiling, level.spikedEdges);

  const objects = makeSimObjects(level);
  const totalCoins = objects.filter(o=>o.type==="coin").length;

  const game = {
    arenaCeiling: ceiling,
    arenaSpikes,
    rails: [null],          // 1-based
    railOwners: [null],     // 1-based; owner objects (arena handled as "arena")
    levelComplete: false,
    coinsCollected: 0,
    lastLevelScore: 0,
    crankTargets: [null, {kind:"ball"}],   // 1-based
    selIndex: 1,
    frameCount: 0,
    tutorial: level.tutorial || "",
    levelName: level.name || "",
  };
  let barIndex = 0;
  for (const obj of objects){
    if (obj.type==="deflector" || obj.type==="sliding_wall" || obj.type==="launcher"){
      barIndex++;
      if (obj.type==="sliding_wall") obj.barLabel = "SLIDER " + barIndex;
      else if (obj.type==="launcher") obj.barLabel = "LAUNCH " + barIndex;
      else obj.barLabel = "BAR " + String.fromCharCode(64+barIndex);
      game.crankTargets.push({kind:"object", obj});
    }
  }

  const ball = {
    rail:1, s:0, spawnRail:1, spawnS:0,
    lastDir:1, respawnFlash:0, travelDir:0, frameCount:0, crankPolarity:1,
    ignoreOwner:null, ignoreClearDist:0,
    ignoreArcFromS:null, ignoreArcNeed:0, ignoreClearBelowY:null,
    dropOriginY:null, dropFromRailIndex:null, fallStartY:null,
    mode:"cling", dockedLauncher:null,
    ignoreLauncher:null, ignoreLauncherFrames:0,
    flightX:0, flightY:0, flightVx:0, flightVy:0, flightGrace:0,
  };
  let exitReached = false;

  /* -------- ports of cling_ball.lua -------- */
  function resetToSpawn(){
    ball.rail = ball.spawnRail; ball.s = ball.spawnS;
    ball.lastDir = 1; ball.travelDir = 0; ball.crankPolarity = 1;
    ball.respawnFlash = 0;
    ball.ignoreOwner = null; ball.ignoreClearDist = 0;
    ball.ignoreArcFromS = null; ball.ignoreArcNeed = 0;
    ball.ignoreClearBelowY = null;
    ball.dropOriginY = null; ball.dropFromRailIndex = null; ball.fallStartY = null;
    ball.mode = "cling"; ball.dockedLauncher = null;
    ball.ignoreLauncher = null; ball.ignoreLauncherFrames = 0;
    ball.flightGrace = 0; ball.flightVx = 0; ball.flightVy = 0;
  }
  function setSpawn(railIndex, s){ ball.spawnRail = railIndex; ball.spawnS = s; resetToSpawn(); }
  const isDocked = ()=> ball.mode === "docked";
  const isInFlight = ()=> ball.mode === "flight";
  const isFalling = ()=> ball.mode === "falling";
  function worldPos(){
    if (ball.mode === "docked" && ball.dockedLauncher) return simGetMouthPos(ball.dockedLauncher);
    if (ball.mode === "flight" || ball.mode === "falling") return [ball.flightX, ball.flightY];
    const rail = game.rails[ball.rail];
    if (!rail) return [0,0];
    return RL.pointAt(rail, ball.s);
  }
  function clampOrWrap(){
    const rail = game.rails[ball.rail];
    if (!rail) return;
    const len = RL.length(rail);
    if (len <= 0){ ball.s = 0; return; }
    if (rail.closed) ball.s = mod(ball.s, len);
    else { if (ball.s < 0) ball.s = 0; if (ball.s > len) ball.s = len; }
  }
  function crank(change){
    if (ball.mode !== "cling") return;
    if (Math.abs(change) <= 0.1) return;
    const polarity = ball.crankPolarity || 1;
    const delta = change * SIM.BALL_CRANK_SENS * polarity;
    ball.s += delta;
    ball.lastDir = (delta >= 0) ? 1 : -1;
    ball.travelDir = ball.lastDir;
    clampOrWrap();
  }
  function consumeTravelDir(){ const d = ball.travelDir; ball.travelDir = 0; return d; }

  function ownerOf(railIndex){
    if (railIndex === 1) return "arena";
    return game.railOwners[railIndex] || null;
  }
  const arenaCeilingMode = ()=> game.arenaCeiling || "solid";
  function arenaEdgeLengths(){
    const inset = SIM.ARENA_INSET;
    return [CFG.SCREEN_W - 2*inset, CFG.SCREEN_H - 2*inset];
  }
  function arenaEdgeSRange(edge){
    const [W,H] = arenaEdgeLengths();
    if (arenaCeilingMode() === "open"){
      if (edge === "left") return [0, H];
      if (edge === "bottom") return [H, H+W];
      if (edge === "right") return [H+W, H+2*W];
      return [null, null];
    }
    if (edge === "top") return [0, W];
    if (edge === "right") return [W, W+H];
    if (edge === "bottom") return [W+H, 2*W+H];
    if (edge === "left") return [2*W+H, 2*W+2*H];
    return [null, null];
  }
  function arenaFloorSRange(){
    const [s0,s1] = arenaEdgeSRange("bottom");
    return [s0, s1];
  }
  function arenaCeilingSRange(){
    const [s0,s1] = arenaEdgeSRange("top");
    if (s0 == null) return [0, 0];
    return [s0, s1];
  }
  function arenaFloorSegIndex(){
    // 1-based segment index, as in the Lua.
    if (arenaCeilingMode() === "open") return 2;
    return 3;
  }
  function sOnSpikedArenaEdge(s){
    const spikes = game.arenaSpikes || {};
    if (!(spikes.top || spikes.bottom || spikes.left || spikes.right)) return false;
    const arena = game.rails[1];
    if (arena){
      const len = RL.length(arena);
      if (len > 0) s = mod(s, len);
    }
    for (const edge of ARENA_EDGE_NAMES){
      if (!spikes[edge]) continue;
      const [e0,e1] = arenaEdgeSRange(edge);
      if (e0 != null && s >= e0 && s < e1) return true;
    }
    return false;
  }
  function railIndexOfOwner(owner){
    if (owner === "arena") return 1;
    for (let i=1;i<game.railOwners.length;i++){
      if (game.railOwners[i] === owner) return i;
    }
    return null;
  }
  function tipClearance(rail){
    const halfW = rail.halfWidth ?? SIM.BAR_WIDTH/2;
    return halfW + SIM.JUNCTION_EPSILON;
  }
  function closestOnBarEndCap(rail, tipAlongSign, px, py){
    const hL = (rail.barLength || 0)/2;
    const hW = rail.halfWidth ?? 8;
    const along = tipAlongSign * hL;
    const ox = rail.cx + rail.ux*along;
    const oy = rail.cy + rail.uy*along;
    let t = (px-ox)*rail.px + (py-oy)*rail.py;
    if (t < -hW) t = -hW; else if (t > hW) t = hW;
    const bx = ox + rail.px*t;
    const by = oy + rail.py*t;
    const d = Math.hypot(bx-px, by-py);
    const cp = RL.closestPoint(rail, bx, by);

  function pickOutlinePushSign(rail, landS, landPerp, px, py, tvx, tvy, preferSide){
    const clear = tipClearance(rail);
    let bestSign = 1, bestScore = -Infinity;
    for (const sign of [1,-1]){
      const [nx,ny] = RL.pointAt(rail, landS + sign*clear);
      const dist = Math.hypot(nx-px, ny-py);
      const travel = (nx-px)*tvx + (ny-py)*tvy;
      const side = (nx-rail.cx)*rail.px + (ny-rail.cy)*rail.py;
      let sideBonus = 0;
      if (preferSide != null && preferSide !== 0){
        sideBonus = (preferSide*side > 0) ? 200 : -200;
      } else if (landPerp != null && landPerp !== 0){
        if (landPerp*side > 0) sideBonus = 50;
        else if (landPerp*side < 0) sideBonus = -50;
      }
      const score = sideBonus + travel*3 - dist;
      if (score > bestScore){ bestScore = score; bestSign = sign; }

    return bestSign;
  }
  function minDistToOwnerRail(owner, px, py){
    const idx = railIndexOfOwner(owner);
    if (!idx) return Infinity;
    const r = game.rails[idx];
    if (!r) return Infinity;
    if (r.kind === "bar_outline"){
      const dA = closestOnBarEndCap(r,-1,px,py).d;
      const dB = closestOnBarEndCap(r, 1,px,py).d;
      return Math.min(dA,dB);
    }
    const bpts = RL.boardingPoints(r);
    if (bpts == null) return RL.closestPoint(r,px,py).d;
    let best = Infinity;
    for (const s of bpts){
      const [bx,by] = RL.pointAt(r,s);
      const d = Math.hypot(bx-px, by-py);
      if (d < best) best = d;
    }
    return best;
  }
  function arenaArcDist(a,b){
    const arena = game.rails[1];

  function clearIgnore(){

    ball.ignoreArcFromS = null; ball.ignoreArcNeed = 0;
    ball.ignoreClearBelowY = null;

  function updateIgnoreClear(px,py){
    if (!ball.ignoreOwner) return;

      if (py > ball.ignoreClearBelowY) clearIgnore();

    if (ball.ignoreArcFromS != null && ball.rail === 1){
      if (arenaArcDist(ball.s, ball.ignoreArcFromS) >= (ball.ignoreArcNeed || 28)) clearIgnore();
      return;
    }
    const d = minDistToOwnerRail(ball.ignoreOwner, px, py);
    let need = ball.ignoreClearDist;

    if (d > need) clearIgnore();

  function isIgnored(railIndex){
    if (!ball.ignoreOwner) return false;

  function leavingThroughTip(rail, tipAlongSign, tvx, tvy){

  function boardingIntoTip(rail, tipAlongSign, tvx, tvy){

  function applyTransfer(toRailIndex, landS, sign, push, travelDir, leftIndex){

    ball.s = landS + sign*push;
    ball.lastDir = sign;
    ball.crankPolarity = sign * travelDir * oldPol;
    if (ball.crankPolarity === 0) ball.crankPolarity = 1;
    clampOrWrap();

    const nRail = game.rails[toRailIndex];
    if (nRail && !nRail.closed){
      const len = RL.length(nRail);
      if (ball.s <= 0.01){
        ball.s = push; ball.lastDir = 1;
        ball.crankPolarity = travelDir * oldPol;
      } else if (ball.s >= len - 0.01){
        ball.s = len - push; ball.lastDir = -1;
        ball.crankPolarity = -travelDir * oldPol;
      }
    }

    ball.ignoreOwner = ownerOf(leftIndex);
    const snap = SIM.JUNCTION_SNAP;
    ball.ignoreClearDist = snap + push + 8;
    ball.ignoreClearBelowY = null;
    if (toRailIndex === 1 && ownerOf(leftIndex) !== "arena"){
      ball.ignoreArcFromS = ball.s;
      ball.ignoreArcNeed = Math.max(28, push + 12);

      ball.ignoreArcFromS = null;
      ball.ignoreArcNeed = 0;
    }
  }

  function resolveJunction(travelDir){
    if (ball.mode !== "cling") return;
    if (travelDir === 0) return;
    const myRail = game.rails[ball.rail];
    if (!myRail) return;

    // Open-top arena: cranking past a top tip drops into freefall.
    if (ball.rail === 1 && arenaCeilingMode() === "open" && !myRail.closed){
      const len = RL.length(myRail);
      const tipEps = 2.0;
      if ((ball.s <= tipEps && travelDir < 0) || (ball.s >= len - tipEps && travelDir > 0)){
        beginFallFromCling();
        return;
      }
    }

    const [px,py] = RL.pointAt(myRail, ball.s);
    updateIgnoreClear(px,py);

    const [mtx,mty] = RL.tangentAt(myRail, ball.s);
    const tvx = mtx*travelDir, tvy = mty*travelDir;
    const snap = SIM.JUNCTION_SNAP;
    const leftIndex = ball.rail;

    // On a bar outline: may exit to arena only through a tip, outward.
    if (myRail.kind === "bar_outline"){
      if (!isIgnored(1)){
        const arena = game.rails[1];
        let bestTip = null, bestD = snap;
        for (const tipSign of [-1,1]){
          const cap = closestOnBarEndCap(myRail, tipSign, px, py);
          if (cap.d <= bestD && leavingThroughTip(myRail, cap.alongSign, tvx, tvy)){
            const acp = RL.closestPoint(arena, px, py);
            if (acp.d <= snap){
              bestD = cap.d;
              bestTip = {arenaS: acp.s, tipDist: cap.d, alongSign: cap.alongSign};
            }
          }
        }
        if (bestTip){
          const arena2 = game.rails[1];
          const [ntx,nty] = RL.tangentAt(arena2, bestTip.arenaS);
          const push = Math.max(SIM.JUNCTION_EPSILON, 14);
          const backX = px - tvx*10, backY = py - tvy*10;
          const side = (backX-myRail.cx)*myRail.px + (backY-myRail.cy)*myRail.py;
          const preferX = myRail.px * ((side >= 0) ? 1 : -1);
          const preferY = myRail.py * ((side >= 0) ? 1 : -1);
          const sideDot = ntx*preferX + nty*preferY;
          const travelDot = ntx*tvx + nty*tvy;
          let sign;
          if (Math.abs(sideDot) >= 0.15) sign = (sideDot >= 0) ? 1 : -1;
          else if (Math.abs(travelDot) >= 0.15) sign = (travelDot >= 0) ? 1 : -1;
          else {
            const [ax,ay] = RL.pointAt(arena2, bestTip.arenaS + push);
            const [bx,by] = RL.pointAt(arena2, bestTip.arenaS - push);
            const dPos = (ax-myRail.cx)**2 + (ay-myRail.cy)**2;
            const dNeg = (bx-myRail.cx)**2 + (by-myRail.cy)**2;
            sign = (dPos >= dNeg) ? 1 : -1;
          }
          applyTransfer(1, bestTip.arenaS, sign, push, travelDir, leftIndex);
          return;
        }
      }
      // Fall through to generic tip checks for other outlines.
    }

    // Generic / boarding bars from arena or tip-to-tip.
    let best = null, bestDist = snap;
    const fromArena = (ball.rail === 1);

    for (let i=1;i<game.rails.length;i++){
      const r = game.rails[i];
      if (i === ball.rail || isIgnored(i)) continue;
      if (r.kind === "bar_outline"){
        for (const tipSign of [-1,1]){
          const cap = closestOnBarEndCap(r, tipSign, px, py);
          if (cap.d <= bestDist){
            let ok;
            if (fromArena){
              const toward = (cap.cx-px)*tvx + (cap.cy-py)*tvy;
              ok = boardingIntoTip(r, cap.alongSign, tvx, tvy)
                || toward > 0.02
                || cap.d <= snap*0.75;
            } else {
              const toX = cap.cx-px, toY = cap.cy-py;
              ok = (cap.d <= 2) || (toX*tvx + toY*tvy > 0.05);
            }
            if (ok){
              bestDist = cap.d;
              best = {rail:i, s:cap.s, outline:true, perp:cap.perp, alongSign:cap.alongSign, fromArena};

          }
        }
      } else {
        const bpts = RL.boardingPoints(r);
        if (bpts == null){
          // Arena from a non-outline rail (open wall, etc.)
          if (myRail.kind !== "bar_outline"){
            const cp = RL.closestPoint(r, px, py);
            if (cp.d <= bestDist){
              const [cx2,cy2] = RL.pointAt(r, cp.s);
              if (cp.d <= 2 || (cx2-px)*tvx + (cy2-py)*tvy > 0.05){
                best = {rail:i, s:cp.s}; bestDist = cp.d;
              }
            }
          }
        } else {
          for (const s of bpts){
            const [bx,by] = RL.pointAt(r, s);
            const d = Math.hypot(bx-px, by-py);
            if (d <= bestDist){
              if (d <= 2 || (bx-px)*tvx + (by-py)*tvy > 0.05){
                best = {rail:i, s}; bestDist = d;
              }
            }
          }
        }
      }
    }

    if (!best) return;

    const nRail = game.rails[best.rail];
    let sign;
    let push = SIM.JUNCTION_EPSILON;

    if (best.outline){
      let preferSide = null;
      if (best.fromArena){
        const travelSide = tvx*nRail.px + tvy*nRail.py;
        if (Math.abs(travelSide) > 0.05) preferSide = -travelSide;
      }
      sign = pickOutlinePushSign(nRail, best.s, best.perp, px, py, tvx, tvy, preferSide);
      push = tipClearance(nRail);
    } else {
      const [ntx,nty] = RL.tangentAt(nRail, best.s);

      sign = (dot >= 0) ? 1 : -1;
      if (Math.abs(dot) < 0.05){
        let bestSgn = 1, bestD2 = -1;
        for (const sgn of [1,-1]){
          const [nx,ny] = RL.pointAt(nRail, best.s + sgn*push);
          const dd = (nx-px)**2 + (ny-py)**2;
          if (dd > bestD2){ bestD2 = dd; bestSgn = sgn; }
        }
        sign = bestSgn;
      }
      if (!nRail.closed){
        const len = RL.length(nRail);
        sign = (best.s <= len*0.5) ? 1 : -1;
        push = Math.max(push, 10);
      }
    }

    applyTransfer(best.rail, best.s, sign, push, travelDir, leftIndex);
  }

  function tryBoardLauncher(){
    if (ball.mode === "flight" || ball.mode === "falling") return;

        const [mx,my] = simGetMouthPos(obj);
        const dMouth = Math.hypot(mx-px, my-py);

  }
  function landFromFlight(railIndex, landS){

    const [ntx,nty] = RL.tangentAt(nRail, landS);
    let vx = ball.flightVx, vy = ball.flightVy;
    let vlen = Math.hypot(vx,vy);
    if (vlen < 0.01){ vx = ntx; vy = nty; vlen = 1; }
    const ux = vx/vlen, uy = vy/vlen;
    const dot = ntx*ux + nty*uy;

      push = tipClearance(nRail);

  function padNormal(owner){
    const a = rad((owner && owner.angle) || 0);
    const tx = Math.cos(a), ty = Math.sin(a);

    if (ny > 0){ nx = -nx; ny = -ny; }
    const len = Math.hypot(nx, ny);
    if (len < 1e-6) return [0, -1];
    return [nx/len, ny/len];
  }
  function landingImpact(railIndex, fromFlight){
    const owner = ownerOf(railIndex);

    if (owner && typeof owner === "object" && owner.type === "bounce_pad"){
      [nx, ny] = padNormal(owner);
    }
    if (fromFlight) return [Math.abs(ball.flightVx*nx + ball.flightVy*ny), nx, ny, owner];
    return [Math.abs(ball.flightVy), nx, ny, owner];
  }
  function breakWall(owner){
    if (!owner || owner.broken) return;
    owner.broken = true;

  }
  function tryLandingSpecial(railIndex, fromFlight){
    const [impact, nx, ny, owner] = landingImpact(railIndex, fromFlight);
    if (!owner || typeof owner !== "object") return false;

      if (fromFlight || impact >= SIM.BREAK_BY_FALL_IMPACT){
        breakWall(owner);

      }
      return false;
    }
    if (owner.type === "bounce_pad"){

  function bouncerReflect(){
    if (ball.mode !== "flight" && ball.mode !== "falling") return false;
    const br = SIM.BALL_RADIUS;
    for (const o of objects){
      if (o.type !== "bouncer") continue;
      const dx = ball.flightX - o.x, dy = ball.flightY - o.y;
      const d2 = dx*dx + dy*dy;
      const rr = (o.radius ?? SIM.BOUNCER_RADIUS) + br;

      const r = game.rails[i];
      const cp = RL.closestPoint(r, ball.flightX, ball.flightY);
      if (cp.d < bestD){

        } else {

  function integrateWithChecks(stepFn){
    const dist = Math.hypot(ball.flightVx, ball.flightVy);
    const maxStep = SIM.MAX_SUBSTEP;
    const n = Math.max(1, Math.ceil(dist / maxStep));
    for (let i=0;i<n;i++){
      const prevX = ball.flightX, prevY = ball.flightY;
      ball.flightX += ball.flightVx / n;
      ball.flightY += ball.flightVy / n;
      if (stepFn(prevX, prevY)) return true;
    }
    return false;
  }
  function stepFlight(){
    if (ball.mode !== "flight") return;
    const graceThisFrame = ball.flightGrace > 0;
    if (graceThisFrame) ball.flightGrace--;

    integrateWithChecks((prevX, prevY)=>{
      if (ball.flightX < -margin || ball.flightX > CFG.SCREEN_W + margin
        || ball.flightY < -margin || ball.flightY > CFG.SCREEN_H + margin){

      bouncerReflect();

  /* ---- drop / falling ---- */
  function beginFallFromCling(){
    const [px,py] = worldPos();
    const leftIndex = ball.rail;
    const owner = ownerOf(leftIndex);
    ball.flightX = px; ball.flightY = py;
    ball.flightVx = 0; ball.flightVy = SIM.FALL_START_VY;
    ball.mode = "falling";
    ball.travelDir = 0; ball.lastDir = 1; ball.crankPolarity = 1;
    ball.dockedLauncher = null; ball.flightGrace = 0;
    ball.fallStartY = py;
    ball.ignoreOwner = owner;
    ball.ignoreClearDist = 0;
    ball.ignoreArcFromS = null; ball.ignoreArcNeed = 0;
    ball.ignoreClearBelowY = null;
    ball.dropOriginY = py;
    ball.dropFromRailIndex = leftIndex;
  }
  function isOnArenaFloor(){
    if (ball.rail !== 1) return false;
    const arena = game.rails[1];
    if (!arena) return false;
    const len = RL.length(arena);
    if (len <= 0) return false;
    let s = mod(ball.s, len);
    if (!arena.closed){
      s = ball.s;
      if (s < 0) s = 0;
      if (s > len) s = len;
    }
    const [s0,s1] = arenaFloorSRange();
    return s >= s0 && s < s1;
  }
  const faceNyThreshold = ()=> SIM.DROP_FACE_NY;
  function segmentStandingNormal(rail, seg){
    const dx = seg.b.x - seg.a.x, dy = seg.b.y - seg.a.y;
    const len = seg.len;
    if (len <= 1e-6) return [0,0];
    return [dy/len, -dx/len];
  }
  function segmentIsLandable(railIndex, rail, segIndex1, seg){
    // segIndex1 is 1-BASED, matching the Lua.
    // NOTE: the attached cling_ball.lua distinguishes the arena by "not rail.kind",
    // which also matches plain walls and makes them fall-through — contradicting
    // L2 "Drop In" ("Fall and land on flat tops") and leaving the open-rail branch
    // of landFromFall unreachable. We follow the evident intent: arena = rail 1,
    // every other rail is landable where its standing normal points up.
    const faceNy = faceNyThreshold();
    if (rail.kind === "bar_outline"){
      if (segIndex1 === 1) return (-rail.py) < faceNy;
      if (segIndex1 === 3) return rail.py < faceNy;
      return false;
    }
    if (railIndex === 1){
      return segIndex1 === arenaFloorSegIndex();
    }
    const [,ny] = segmentStandingNormal(rail, seg);
    return ny < faceNy;
  }
  function barTopPreferSide(rail){
    const faceNy = faceNyThreshold();
    if (rail.py < faceNy) return 1;
    if ((-rail.py) < faceNy) return -1;
    if (rail.py <= 0) return 1;
    return -1;
  }
  function fallHitIgnored(railIndex, hitY){
    if (ball.dropOriginY == null) return false;

    if (hitY > ball.dropOriginY + eps) return false;
    if (ball.dropFromRailIndex && railIndex === ball.dropFromRailIndex){
      if (railIndex === 1) return false;

    }
    if (ball.ignoreOwner && ball.ignoreOwner !== "arena" && isIgnored(railIndex)) return true;

  function findFallLanding(cx, minY, maxY, useIgnore){
    const halfW = SIM.BALL_RADIUS;

    for (let i=1;i<game.rails.length;i++){
      const r = game.rails[i];
      const segs = RL.segments(r);
      let accum = 0;
      for (let si=0; si<segs.length; si++){
        const seg = segs[si];
        if (segmentIsLandable(i, r, si+1, seg)){
          const hit = RL.fallHitOnSegment(seg.a.x, seg.a.y, seg.b.x, seg.b.y, accum, cx, halfW, minY);
          if (hit && hit.hitY < bestY){
            if (maxY == null || hit.hitY <= maxY){

  function landFromFall(railIndex, landS){

  }

  return {
    game, ball, objects, totalCoins,
    update, handleCrank, selectCling, cycleObjects, tryDrop, restartLevel,
    worldPos, selectionLabel, fire,
    isDocked, isInFlight, isFalling,
    // internals exposed for tests
    _resolveJunction: resolveJunction, _buildRails: buildRails,
  };
}
